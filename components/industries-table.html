<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* ── Tokens (mirrors nesen.css / exponanta.css) ── */
    :root {
      --blue-700: #2446c8;
      --blue-100: #c8dffa;
      --blue-50: #e8f0fe;
      --neutral-0: #ffffff;
      --neutral-50: #f5f7fa;
      --neutral-100: #eaf0fb;
      --neutral-400: #9ca3af;
      --neutral-600: #4b5563;
      --neutral-900: #1e1e2f;
      --accent-coral: #ff6f61;
      --accent-teal: #4fd1c5;
      --radius-sm: 4px;
      --radius-md: 8px;
      --shadow-sm: 0 2px 8px rgba(36, 70, 200, .10);

      /* industry palette — one per sector */
      --c-agri: #4caf6e;
      --c-auto: #2446c8;
      --c-aero: #6c5ce7;
      --c-energy: #f59e0b;
      --c-health: #e05c7a;
      --c-fin: #0ea5e9;
      --c-tech: #4fd1c5;
      --c-tele: #8b5cf6;
      --c-trans: #f97316;
      --c-mfg: #6b7280;
      --c-const: #a16207;
      --c-retail: #db2777;
      --c-media: #dc2626;
      --c-tour: #059669;
      --c-edu: #7c3aed;
    }

    /* ── Page ── */
    body {
      background: var(--neutral-50);
      color: var(--neutral-900);
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 32px 20px 60px;
    }

    .pt-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .pt-header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--blue-700);
      letter-spacing: -.5px;
      margin-bottom: 6px;
    }

    .pt-header p {
      font-size: 14px;
      color: var(--neutral-400);
    }

    /* ── Filter bar ── */
    .pt-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .pt-filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all .15s;
      background: var(--neutral-0);
      color: var(--neutral-600);
      border-color: var(--neutral-100);
    }

    .pt-filter-btn:hover {
      border-color: var(--blue-700);
      color: var(--blue-700);
    }

    .pt-filter-btn.active {
      background: var(--blue-700);
      color: var(--neutral-0);
      border-color: var(--blue-700);
    }

    .pt-filter-btn .pt-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Grid ── */
    .pt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }

    /* ── Element card ── */
    .pt-element {
      position: relative;
      border-radius: var(--radius-md);
      padding: 10px 10px 12px;
      background: var(--neutral-0);
      border: 1.5px solid var(--neutral-100);
      cursor: default;
      transition: transform .15s, box-shadow .15s;
      overflow: hidden;
      min-height: 90px;
    }

    .pt-element:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-sm);
      z-index: 2;
    }

    /* colour stripe top */
    .pt-element::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--sector-color);
    }

    /* subtle tint background */
    .pt-element {
      background: color-mix(in srgb, var(--sector-color) 6%, white);
    }

    .pt-num {
      font-size: 9px;
      font-weight: 700;
      color: var(--neutral-400);
      line-height: 1;
      margin-bottom: 4px;
    }

    .pt-symbol {
      font-size: 11px;
      font-weight: 800;
      color: var(--sector-color);
      letter-spacing: .3px;
      line-height: 1;
      margin-bottom: 5px;
      font-variant-numeric: tabular-nums;
    }

    .pt-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--neutral-900);
      line-height: 1.3;
      margin: 0;
    }

    .pt-sector-label {
      font-size: 9px;
      color: var(--sector-color);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-top: 5px;
      opacity: .8;
    }

    /* hidden state */
    .pt-element.hidden {
      display: none;
    }

    /* ── Legend ── */
    .pt-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .pt-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--neutral-600);
      font-weight: 600;
    }

    .pt-legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    @media (max-width: 480px) {
      .pt-grid {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }

      .pt-element {
        min-height: 80px;
      }
    }

    /*addded*/

    .pt-prefix {
  font-size: 9px;
  font-weight: 400;
  color: var(--neutral-400);
  line-height: 1.2;
}

.pt-keyword {
  font-size: 15px;
  font-weight: 800;
  line-height: 1.2;
}
  </style>
</head>

      const sector = sectorMap[el.s];
      if (!sectorCount[el.s]) sectorCount[el.s] = 0;
      sectorCount[el.s]++;
      const localNum = sectorCount[el.s];
      const symbol = `${sector.abbr}${String(localNum).padStart(2, '0')}`;

      const div = document.createElement('div');
      div.className = 'pt-element';
      div.dataset.sector = el.s;
      div.style.setProperty('--sector-color', sector.color);
      //added
      function formatName(name, color) {
        const parts = name.split('–');
        const keyword = parts[parts.length - 1].trim();
        const prefix = parts.length > 1 ? parts.slice(0, -1).join('–').trim() : null;
        return prefix
          ? `<span class="pt-prefix">${prefix} –</span><br><span class="pt-keyword" style="color:${color}">${keyword}</span>`
          : `<span class="pt-keyword" style="color:${color}">${name}</span>`;
      }



      div.innerHTML = `
  <div class="pt-num">${globalNum}</div>
  <div class="pt-symbol">${symbol}</div>
  <div class="pt-name">${formatName(el.n, sector.color)}</div>
  <div class="pt-sector-label">${sector.label}</div>
`;
      grid.appendChild(div);
      globalNum++;
    });

    // Filter logic
    filters.addEventListener('click', e => {
      const btn = e.target.closest('.pt-filter-btn');
      if (!btn) return;

      filters.querySelectorAll('.pt-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const target = btn.dataset.sector;
      document.querySelectorAll('.pt-element').forEach(el => {
        if (target === 'all' || el.dataset.sector === target) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    });
