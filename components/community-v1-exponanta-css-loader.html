<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | Exponanta</title>
<meta name="description" content="Connect with founders, engineers, investors, and innovators in the Boston and Cambridge community. Find your next collaborator, co-founder, or mentor.">
<link rel="canonical" href="https://exponanta.com/community.html">
<meta name="robots" content="index, follow">

<meta property="og:title" content="Community | Exponanta">
<meta property="og:description" content="Find and connect with Boston & Cambridge innovators, founders, and professionals.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://exponanta.com/community.html">

<link rel="icon" type="image/svg+xml" href="/brandbook/favicon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/brandbook/exponanta.css" rel="stylesheet">
<link href="/brandbook/exponanta-added.css" rel="stylesheet">

<style>
/* =====================================================
   COMMUNITY PAGE — only new CSS
   All etag / avatar / btn-ev-* from exponanta-added.css
   ===================================================== */

/* ── Search + filter bar ── */
.cm-search-wrap {
  position: relative; flex: 1 1 260px;
}
.cm-search-wrap svg {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--neutral-600); pointer-events: none;
}
.cm-search {
  width: 100%; padding: 10px 14px 10px 38px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--bs-border-color);
  background: var(--neutral-0);
  font-size: var(--text-sm); color: var(--neutral-900);
  outline: none; transition: border-color .15s;
}
.cm-search:focus { border-color: var(--blue-700); }

/* ── Filter chips ── */
.cm-filters {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
.cm-chip {
  padding: 6px 14px; border-radius: 20px;
  font-size: var(--text-sm); font-weight: 600;
  border: 1.5px solid var(--bs-border-color);
  background: var(--neutral-0); color: var(--neutral-600);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.cm-chip.active {
  background: var(--blue-700); color: var(--neutral-0);
  border-color: var(--blue-700);
}
.cm-chip:hover:not(.active) {
  border-color: var(--blue-700); color: var(--blue-700);
}

/* ── Member cards grid ── */
.cm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

/* ── Member card ── */
.cm-card {
  background: var(--neutral-0);
  border-radius: var(--radius-lg);
  border: 1px solid rgba(36,70,200,.09);
  box-shadow: var(--shadow-sm);
  padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
  transition: box-shadow .2s, transform .15s;
}
.cm-card:hover {
  box-shadow: var(--shadow-md); transform: translateY(-2px);
}

/* Card header: avatar + name + role */
.cm-card__header { display: flex; align-items: center; gap: 14px; }

/* Large avatar for member cards — override .avatar 32px */
.cm-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--blue-100); color: var(--blue-700);
  font-size: 20px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0;
  border: 2px solid var(--blue-100);
}
.cm-avatar img { width: 100%; height: 100%; object-fit: cover; }

.cm-card__name {
  font-size: var(--text-md); font-weight: 700;
  color: var(--neutral-900); margin: 0 0 2px; line-height: 1.2;
}
.cm-card__role {
  font-size: var(--text-sm); color: var(--neutral-600); line-height: 1.3;
}
.cm-card__company {
  font-size: var(--text-sm); font-weight: 600; color: var(--blue-700);
}

/* Tags */
.cm-card__tags { display: flex; flex-wrap: wrap; gap: 5px; }

/* Bio */
.cm-card__bio {
  font-size: var(--text-sm); color: var(--neutral-600);
  line-height: 1.55; margin: 0;
  display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}

/* Card footer: city + connect button */
.cm-card__footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 10px; border-top: 1px solid rgba(36,70,200,.07);
  margin-top: auto; gap: 8px;
}
.cm-card__city {
  font-size: 12px; color: var(--neutral-600);
  display: flex; align-items: center; gap: 4px;
}
.cm-card__city svg { color: var(--blue-700); }

/* Count bar */
.cm-count {
  font-size: var(--text-sm); color: var(--neutral-600); font-weight: 500;
}

/* Empty state */
.cm-empty {
  text-align: center; padding: 60px 20px;
  color: var(--neutral-600); font-size: var(--text-md);
  grid-column: 1 / -1;
}

/* Loading skeleton */
.cm-skeleton {
  background: linear-gradient(90deg, var(--neutral-50) 25%, var(--blue-100) 50%, var(--neutral-50) 75%);
  background-size: 200% 100%;
  animation: cm-shimmer 1.4s infinite;
  border-radius: var(--radius-md);
}
@keyframes cm-shimmer { to { background-position: -200% 0; } }
.cm-card--loading .cm-avatar   { background: none; }
.cm-card--loading .cm-avatar,
.cm-card--loading .cm-card__name,
.cm-card--loading .cm-card__role { display: block; }
.cm-card--loading .cm-card__name { height: 16px; width: 60%; margin-bottom: 6px; }
.cm-card--loading .cm-card__role { height: 13px; width: 80%; }
</style>

<!-- ── Fetch intercept — before events.js pattern, same idea for people.json ── -->
<script>
(function () {
  const _fetch = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    const p = _fetch(url, opts);
    if (typeof url === "string" && url.includes("people.json")) {
      p.then(r => r.clone().json())
       .then(data => {
         window.__cmPeople = data;
         if (typeof window.__cmReady === "function") window.__cmReady(data);
       })
       .catch(() => {});
    }
    return p;
  };
})();
</script>
</head>

<body>

<div id="navbar" data-loader="../components/navbar.html"></div>

<main id="main-content" class="py-5">
<div class="container">

  <!-- ── Page heading ── -->
  <div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-4">
    <div>
      <h1 class="mb-1" style="font-size:var(--text-2xl);font-weight:700;color:var(--neutral-900);">Community</h1>
      <p class="text-muted mb-0" style="font-size:var(--text-sm);">
        Find and connect with founders, engineers, investors, and innovators · Boston &amp; Cambridge
      </p>
    </div>
    <a href="/events.html" class="btn-ev-connect" style="align-self:flex-start;">
      Browse Events
    </a>
  </div>

  <!-- ── Search + filters ── -->
  <div class="d-flex flex-wrap gap-3 mb-4 align-items-center">
    <div class="cm-search-wrap">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="cm-search" id="cm-search" type="search"
             placeholder="Search by name, role, or company…" autocomplete="off">
    </div>
    <div class="cm-filters" id="cm-filters">
      <button class="cm-chip active" data-filter="all">All</button>
      <button class="cm-chip" data-filter="Founder">Founders</button>
      <button class="cm-chip" data-filter="Investor">Investors</button>
      <button class="cm-chip" data-filter="Engineer">Engineers</button>
      <button class="cm-chip" data-filter="Cambridge">Cambridge</button>
      <button class="cm-chip" data-filter="Boston">Boston</button>
    </div>
  </div>

  <!-- ── Result count ── -->
  <p class="cm-count mb-3" id="cm-count"></p>

  <!-- ── Member grid ── -->
  <div class="cm-grid" id="cm-grid">
    <!-- Loading skeletons -->
    ${[...Array(6)].map(() => `
    <div class="cm-card cm-card--loading">
      <div class="cm-card__header">
        <div class="cm-avatar cm-skeleton" style="width:56px;height:56px;"></div>
        <div style="flex:1;">
          <div class="cm-skeleton cm-card__name"></div>
          <div class="cm-skeleton cm-card__role"></div>
        </div>
      </div>
    </div>`).join("")}
  </div>

</div>
</main>

<div id="footer" data-loader="../components/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/_loader.js"></script>

<script>
/* =====================================================
   COMMUNITY — people.json renderer
   Mirrors events.js pattern exactly.
   ===================================================== */
(function () {

  const PEOPLE_JSON_URL = "/data/people.json";

  /* ── esc (same as events.js) ── */
  function esc(str) {
    return (str ?? "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ── isImagePath / getInitials / avatarHtml ──
     Mirrors events.js exactly so behaviour is identical. */
  function isImagePath(v) { return /\.(jpg|jpeg|png|webp|gif|svg)$/i.test(v); }

  function getInitials(v) {
    if (!v) return "?";
    if (v.length <= 3 && !v.includes("/")) return v.toUpperCase();
    const file  = v.split("/").pop();
    const name  = file.split(".")[0];
    const parts = name.split(/[-_ ]+/);
    return parts.filter(Boolean).map(p => p[0].toUpperCase()).slice(0, 2).join("") || "?";
  }

  function cmAvatarHtml(value) {
    if (!value) return `<div class="cm-avatar">?</div>`;
    if (isImagePath(value)) {
      const initials = getInitials(value);
      return `<div class="cm-avatar">
        <img src="${esc(value)}" alt=""  loading="lazy"
             onerror="this.parentNode.textContent='${initials}'">
      </div>`;
    }
    return `<div class="cm-avatar">${getInitials(value)}</div>`;
  }

  /* ── tag → etag CSS class (reuse events.js mapping) ── */
  function tagClass(tag) {
    if (["Founder","Operator","Advisor"].includes(tag)) return "etag--blue";
    if (["Investor","VC","Angel"].includes(tag))        return "etag--coral";
    if (["Engineer","Builder","Developer"].includes(tag))return "etag--teal";
    if (["Free","Open"].includes(tag))                   return "etag--free";
    return "";
  }

  /* ── render single member card ── */
  function renderMemberCard(p) {
    const tagsHtml = (p.tags || []).slice(0, 3)
      .map(t => `<span class="etag ${tagClass(t)}" style="font-size:12px;padding:3px 10px;">${esc(t)}</span>`)
      .join("");

    const industryHtml = (p.industry || []).slice(0, 2)
      .map(i => `<span class="etag" style="font-size:11px;padding:2px 8px;background:var(--neutral-50);color:var(--neutral-600);border:1px solid var(--bs-border-color);">${esc(i)}</span>`)
      .join("");

    const connectBtn = p.linkedin
      ? `<a class="btn-ev-connect" href="${esc(p.linkedin)}" target="_blank" rel="noopener"
            style="padding:7px 16px;font-size:13px;">Connect</a>`
      : p.connectUrl
        ? `<a class="btn-ev-connect" href="${esc(p.connectUrl)}" target="_blank" rel="noopener"
              style="padding:7px 16px;font-size:13px;">Connect</a>`
        : `<button class="btn-ev-connect" style="padding:7px 16px;font-size:13px;">Connect</button>`;

    return `
<div class="cm-card"
     data-name="${esc((p.name || "").toLowerCase())}"
     data-role="${esc((p.role || "").toLowerCase())}"
     data-company="${esc((p.company || "").toLowerCase())}"
     data-tags="${esc((p.tags || []).join(" "))}"
     data-city="${esc(p.city || "")}">

  <div class="cm-card__header">
    ${cmAvatarHtml(p.avatar)}
    <div style="min-width:0;">
      <div class="cm-card__name">${esc(p.name)}</div>
      <div class="cm-card__role">${esc(p.role)}</div>
      ${p.company ? `<div class="cm-card__company">${esc(p.company)}</div>` : ""}
    </div>
  </div>

  ${tagsHtml || industryHtml ? `
  <div class="cm-card__tags">
    ${tagsHtml}
    ${industryHtml}
  </div>` : ""}

  ${p.bio ? `<p class="cm-card__bio">${esc(p.bio)}</p>` : ""}

  <div class="cm-card__footer">
    <div class="cm-card__city">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      ${esc(p.city || "Boston")}
    </div>
    ${connectBtn}
  </div>

</div>`;
  }

  /* ── State ── */
  let allPeople  = [];
  let activeFilter = "all";
  let searchVal    = "";

  /* ── Filter + search ── */
  function getVisible() {
    return allPeople.filter(p => {
      const f = activeFilter;
      const matchFilter = f === "all"
        || (p.tags || []).includes(f)
        || p.city === f;
      if (!matchFilter) return false;

      if (!searchVal) return true;
      const q = searchVal.toLowerCase();
      return (p.name    || "").toLowerCase().includes(q)
          || (p.role    || "").toLowerCase().includes(q)
          || (p.company || "").toLowerCase().includes(q)
          || (p.bio     || "").toLowerCase().includes(q);
    });
  }

  function renderGrid() {
    const visible = getVisible();
    const grid    = document.getElementById("cm-grid");
    const count   = document.getElementById("cm-count");

    count.textContent = `${visible.length} member${visible.length !== 1 ? "s" : ""}`;

    if (!visible.length) {
      grid.innerHTML = `<div class="cm-empty">No members found matching your search.</div>`;
      return;
    }

    grid.innerHTML = visible.map(renderMemberCard).join("");
  }

  /* ── Wire up search ── */
  document.getElementById("cm-search").addEventListener("input", function () {
    searchVal = this.value.trim();
    renderGrid();
  });

  /* ── Wire up filter chips ── */
  document.getElementById("cm-filters").addEventListener("click", function (e) {
    const chip = e.target.closest(".cm-chip");
    if (!chip) return;
    activeFilter = chip.dataset.filter;
    document.querySelectorAll(".cm-chip").forEach(c =>
      c.classList.toggle("active", c === chip));
    renderGrid();
  });

  /* ── Load people.json ── */
  async function loadPeople() {
    try {
      const res    = await fetch(PEOPLE_JSON_URL);
      const people = await res.json();
      allPeople    = people;
      renderGrid();
    } catch (err) {
      console.error("People load error:", err);
      document.getElementById("cm-grid").innerHTML =
        `<div class="cm-empty">Could not load community members.</div>`;
    }
  }

  /* ── If fetch interceptor already resolved ── */
  window.__cmReady = function (data) {
    allPeople = data;
    renderGrid();
  };
  if (window.__cmPeople) {
    allPeople = window.__cmPeople;
    renderGrid();
  }

  document.addEventListener("DOMContentLoaded", loadPeople);

})();
</script>

</body>
</html>
