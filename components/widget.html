<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
body{font-family:sans-serif;padding:20px;}
.chip{padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;border:1.5px solid #ccc;background:#f5f5f5;color:#555;display:inline-block;margin:3px;}
.chip.on{border-color:#2446c8;color:#2446c8;background:#c8dffa;}
.ts{padding:8px 14px;border-radius:8px;border:1.5px solid #ccc;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:8px;margin:3px;}
.ts.on{border-color:#2446c8;background:#c8dffa;color:#2446c8;}
</style>
</head><body>

<div id="s1">
  <p><strong>Step 1 — Select vertical</strong></p>
  <div id="chips"></div>
</div>

<div id="s2" style="display:none;margin-top:20px;">
  <p><strong>Step 2 — Pick a date</strong></p>
  <p id="scarc" style="color:orange;"></p>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
    <button id="bPrev">← Prev</button>
    <strong id="mLabel" style="min-width:140px;text-align:center;"></strong>
    <button id="bNext">Next →</button>
  </div>
  <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,44px);gap:4px;"></div>
</div>

<div id="s3" style="display:none;margin-top:20px;">
  <p id="tLabel"><strong></strong></p>
  <div id="timeSlots"></div>
</div>

<div id="s4" style="display:none;margin-top:20px;padding-top:15px;border-top:1px solid #eee;">
  <p id="summary" style="font-weight:600;"></p>
  <button id="bConf">Confirm booking →</button>
</div>

<div id="done" style="display:none;margin-top:20px;color:green;font-weight:600;">
  ✓ Booked!
</div>

<script>
var SLOTS=[
  {date:'2025-04-02',time:'10:00',spots:3},{date:'2025-04-02',time:'14:00',spots:2},
  {date:'2025-04-07',time:'10:00',spots:1},{date:'2025-04-07',time:'15:00',spots:4},
  {date:'2025-04-10',time:'11:00',spots:2},{date:'2025-04-10',time:'14:00',spots:3},
  {date:'2025-04-14',time:'09:00',spots:1},{date:'2025-04-14',time:'16:00',spots:5},
  {date:'2025-04-16',time:'10:00',spots:2},{date:'2025-04-17',time:'14:00',spots:1},
  {date:'2025-04-23',time:'11:00',spots:3},{date:'2025-04-24',time:'15:00',spots:2},
  {date:'2025-04-28',time:'10:00',spots:1},{date:'2025-04-30',time:'11:00',spots:2}
];
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var V='',SD='',ST='',cy=2025,cm=3;

['💻 Technology','🏥 Healthcare','💳 Finance','⚡ Energy','🏭 Industrial','🛒 Retail','🎓 Education','🏛️ Government'].forEach(function(name){
  var c=document.createElement('span');
  c.className='chip';c.textContent=name;
  c.addEventListener('click',function(){
    document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
    c.classList.add('on');V=name;
    document.getElementById('s2').style.display='block';
    document.getElementById('scarc').textContent=SLOTS.filter(function(s){return s.spots===1;}).length+' slots with 1 spot left';
    renderCal();
  });
  document.getElementById('chips').appendChild(c);
});

document.getElementById('bPrev').onclick=function(){cm--;if(cm<0){cm=11;cy--;}SD='';ST='';document.getElementById('s3').style.display='none';document.getElementById('s4').style.display='none';renderCal();};
document.getElementById('bNext').onclick=function(){cm++;if(cm>11){cm=0;cy++;}SD='';ST='';document.getElementById('s3').style.display='none';document.getElementById('s4').style.display='none';renderCal();};
document.getElementById('bConf').onclick=function(){['s2','s3','s4'].forEach(function(id){document.getElementById(id).style.display='none';});document.getElementById('done').style.display='block';};

function renderCal(){
  document.getElementById('mLabel').textContent=MN[cm]+' '+cy;
  var grid=document.getElementById('calGrid');
  grid.innerHTML='';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(function(d){
    var h=document.createElement('div');
    h.style.cssText='width:44px;height:28px;text-align:center;font-size:11px;color:#999;display:flex;align-items:center;justify-content:center;';
    h.textContent=d;grid.appendChild(h);
  });
  var ms=cy+'-'+String(cm+1).padStart(2,'0');
  var idx={};
  SLOTS.forEach(function(s){if(s.date.indexOf(ms)===0){if(!idx[s.date])idx[s.date]=999;idx[s.date]=Math.min(idx[s.date],s.spots);}});
  var firstDow=(new Date(cy,cm,1).getDay()+6)%7;
  var dim=new Date(cy,cm+1,0).getDate();
  for(var i=0;i<firstDow;i++){var b=document.createElement('div');b.style.cssText='width:44px;height:44px;';grid.appendChild(b);}
  for(var d=1;d<=dim;d++){
    var ds=cy+'-'+String(cm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var cell=document.createElement('div');
    cell.textContent=d;
    var base='width:44px;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;box-sizing:border-box;';
    if(idx[ds]!==undefined){
      cell.style.cssText=base+(ds===SD?'background:#2446c8;color:#fff;':idx[ds]===1?'background:#fff3cd;color:#856404;cursor:pointer;':'background:#c8dffa;color:#2446c8;cursor:pointer;');
      (function(date){cell.addEventListener('click',function(){pickDate(date);});})(ds);
    } else {
      cell.style.cssText=base+'color:#ccc;';
    }
    grid.appendChild(cell);
  }
}

function pickDate(ds){
  SD=ds;ST='';renderCal();
  var parts=ds.split('-');
  document.getElementById('tLabel').innerHTML='<strong>Times on '+parseInt(parts[2])+' '+MS[parseInt(parts[1])-1]+'</strong>';
  var box=document.getElementById('timeSlots');box.innerHTML='';
  SLOTS.filter(function(s){return s.date===ds;}).forEach(function(s){
    var btn=document.createElement('div');btn.className='ts';
    btn.innerHTML=s.time+' <span style="font-size:11px;font-weight:600;padding:2px 7px;border-radius:8px;background:'+(s.spots===1?'#f0ad4e':'#2446c8')+';color:#fff;">'+(s.spots===1?'Last spot':s.spots+' left')+'</span>';
    (function(slot,el){el.addEventListener('click',function(){
      document.querySelectorAll('.ts').forEach(function(x){x.classList.remove('on');});
      el.classList.add('on');ST=slot.time;
      var p=SD.split('-');
      document.getElementById('summary').textContent=V+' · '+parseInt(p[2])+' '+MN[parseInt(p[1])-1]+' at '+slot.time;
      document.getElementById('s4').style.display='block';
    });})(s,btn);
    box.appendChild(btn);
  });
  document.getElementById('s3').style.display='block';
  document.getElementById('s4').style.display='none';
}
</script>
</body></html>
