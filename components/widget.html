  <style>
    /* =========================================================

    /* Partners strip */
    .cfe-partners-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 32px;
    }
    .cfe-partners-strip img {
      height: 36px;
      object-fit: contain;
      filter: grayscale(100%) opacity(.45);
      transition: filter .2s;
    }
    .cfe-partners-strip img:hover { filter: grayscale(0%) opacity(1); }

    /* People 6-col grid (board) */
    .cfe-people-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1px;
      background: var(--bs-border-color);
      border: 1px solid var(--bs-border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .cfe-person {
      background: var(--neutral-0);
      padding: 22px 10px;
      text-align: center;
      text-decoration: none;
      transition: background .15s;
    }
    .cfe-person:hover { background: var(--neutral-50); }
    .cfe-person__avatar {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--blue-100);
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-md); font-weight: 700; color: var(--blue-700);
      overflow: hidden;
    }
    .cfe-person__name { font-size: 12px; font-weight: 700; color: var(--neutral-900); margin: 0 0 2px; line-height: 1.3; }
    .cfe-person:hover .cfe-person__name { color: var(--blue-700); }
    .cfe-person__role { font-size: var(--text-xs); color: var(--accent-coral); font-weight: 600; display: block; margin-bottom: 1px; }
    .cfe-person__group { font-size: 10px; color: var(--neutral-400); text-transform: uppercase; letter-spacing: .7px; }
    .cfe-person__li { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
    .cfe-person__li img { width: 14px; height: 14px; opacity: .35; transition: opacity .15s; }
    .cfe-person__li a:hover img { opacity: 1; }

    @media (max-width: 1024px) { .cfe-people-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px)  { .cfe-people-grid { grid-template-columns: repeat(2, 1fr); } }

<body>

<!-- CTA Progress Stepper — 3 steps, no chat gate -->
<!-- Reads from /data/calendar.json — exponanta.css + Bootstrap only -->
 
<style>
.cfe-chip {
  display: inline-flex; align-items: center;
  padding: 5px 12px; border-radius: var(--radius-sm);
  font-size: var(--text-sm); font-weight: 500; cursor: pointer;
  border: 1.5px solid var(--bs-border-color);
  background: var(--neutral-50); color: var(--neutral-600);
  transition: all .15s; user-select: none;
}
.cfe-chip:hover, .cfe-chip.selected {
  border-color: var(--blue-700); color: var(--blue-700); background: var(--blue-100);
}
.cfe-step-circle {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.cfe-step-circle--active  { background: var(--neutral-0);  border: 2px solid var(--neutral-900); }
.cfe-step-circle--done    { background: var(--blue-100);   border: 2px solid var(--blue-700); }
.cfe-step-circle--waiting { background: var(--neutral-50); border: 2px solid var(--bs-border-color); }
.cfe-connector { width: 2px; min-height: 40px; margin: 4px 0; }
.cfe-connector--active  { background: var(--blue-700); }
.cfe-connector--waiting { background: var(--bs-border-color); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.cal-day-header { font-size: 11px; font-weight: 600; text-align: center; color: var(--neutral-400); text-transform: uppercase; letter-spacing: .5px; padding: 4px 0; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: 500; cursor: default; color: var(--neutral-400); }
.cal-day.has-slot { background: var(--blue-100); color: var(--blue-700); cursor: pointer; border: 1.5px solid transparent; transition: all .15s; }
.cal-day.has-slot:hover { border-color: var(--blue-700); transform: scale(1.08); }
.cal-day.has-slot.urgent { background: rgba(255,111,97,.12); color: #c0392b; }
.cal-day.selected-day { background: var(--blue-700) !important; color: var(--neutral-0) !important; border-color: var(--blue-700) !important; }
.cal-day.other-month { opacity: .3; }
.time-slot { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--bs-border-color); background: var(--neutral-0); cursor: pointer; font-size: var(--text-sm); font-weight: 500; color: var(--neutral-900); transition: all .15s; }
.time-slot:hover, .time-slot.selected-time { border-color: var(--blue-700); background: var(--blue-100); color: var(--blue-700); }
.time-slot .spots { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 10px; background: var(--blue-700); color: var(--neutral-0); }
.time-slot .spots.urgent { background: var(--accent-coral); }
</style>
 
<div class="card p-4" style="max-width:640px;">
 
  <p class="mb-4" style="font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--neutral-400);">Get started in 3 steps</p>
 
  <!-- STEP 1: Select vertical -->
  <div class="d-flex gap-3">
    <div class="d-flex flex-column align-items-center">
      <div class="cfe-step-circle cfe-step-circle--active" id="s1-circle">
        <div style="width:10px;height:10px;border-radius:50%;background:var(--neutral-900);"></div>
      </div>
      <div class="cfe-connector cfe-connector--waiting" id="s1-line"></div>
    </div>
    <div class="flex-grow-1 pb-4">
      <p class="mb-0" id="s1-label" style="font-size:var(--text-xs);font-weight:600;color:var(--neutral-600);">Step 1 — current</p>
      <p class="fw-semibold mb-3" style="font-size:var(--text-md);color:var(--neutral-900);">Select your vertical</p>
      <div class="d-flex flex-wrap gap-2" id="chip-selector">
        <span class="cfe-chip" onclick="selectVertical(this,'Technology & Software')">💻 Technology</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Healthcare & Life Sciences')">🏥 Healthcare</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Financial Services')">💳 Finance</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Energy & Climate')">⚡ Energy</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Industrial & Manufacturing')">🏭 Industrial</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Consumer & Retail')">🛒 Retail</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Education & Research')">🎓 Education</span>
        <span class="cfe-chip" onclick="selectVertical(this,'Government & Defense')">🏛️ Government</span>
      </div>
      <p id="s1-chosen" style="display:none;font-size:var(--text-sm);font-weight:600;color:var(--blue-700);" class="mb-0"></p>
    </div>
  </div>
 
  <!-- STEP 2: Book pitch slot -->
  <div class="d-flex gap-3">
    <div class="d-flex flex-column align-items-center">
      <div class="cfe-step-circle cfe-step-circle--waiting" id="s2-circle">
        <span style="font-size:var(--text-xs);font-weight:600;color:var(--neutral-400);">2</span>
      </div>
      <div class="cfe-connector cfe-connector--waiting" id="s2-line"></div>
    </div>
    <div class="flex-grow-1 pb-4">
      <p class="mb-0" id="s2-label" style="font-size:var(--text-xs);font-weight:600;color:var(--neutral-400);">Step 2</p>
      <p class="fw-semibold mb-0" id="s2-title" style="font-size:var(--text-md);color:var(--neutral-400);">Book your pitch slot</p>
 
      <div id="s2-calendar" style="display:none;" class="mt-3">
        <p id="scarcity-line" class="mb-3" style="font-size:var(--text-sm);color:var(--accent-coral);font-weight:600;"></p>
        <div class="d-flex align-items-center justify-content-between mb-2">
          <button class="btn btn-sm btn-outline-primary" onclick="changeMonth(-1)">← Prev</button>
          <span id="month-label" class="fw-semibold" style="font-size:var(--text-md);color:var(--neutral-900);"></span>
          <button class="btn btn-sm btn-outline-primary" onclick="changeMonth(1)">Next →</button>
        </div>
        <div class="cal-grid" id="cal-headers"></div>
        <div class="cal-grid" id="cal-body"></div>
        <div id="time-picker" style="display:none;" class="mt-3">
          <p class="mb-2" style="font-size:var(--text-sm);font-weight:600;color:var(--neutral-600);" id="time-picker-label"></p>
          <div class="d-flex flex-wrap gap-2" id="time-slots"></div>
        </div>
        <div id="confirm-area" style="display:none;" class="mt-3 pt-3 border-top">
          <p class="mb-2" style="font-size:var(--text-sm);color:var(--neutral-600);" id="confirm-summary"></p>
          <button class="btn btn-primary btn-sm" onclick="confirmBooking()">Confirm booking →</button>
        </div>
      </div>
 
      <p id="s2-chosen" style="display:none;font-size:var(--text-sm);font-weight:600;color:var(--blue-700);" class="mb-0 mt-1"></p>
    </div>
  </div>
 
  <!-- STEP 3: Get leads -->
  <div class="d-flex gap-3">
    <div class="d-flex flex-column align-items-center">
      <div class="cfe-step-circle cfe-step-circle--waiting" id="s3-circle">
        <span style="font-size:var(--text-xs);font-weight:600;color:var(--neutral-400);">3</span>
      </div>
    </div>
    <div>
      <p class="mb-0" style="font-size:var(--text-xs);font-weight:600;color:var(--neutral-400);">Step 3</p>
      <p class="fw-semibold mb-0" id="s3-title" style="font-size:var(--text-md);color:var(--neutral-400);">Get leads</p>
    </div>
  </div>
 
</div>
 
<script>
var allSlots = [], selectedVertical = '', selectedDate = '', selectedTime = '';
var currentYear, currentMonth;
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 
fetch('/data/calendar.json')
  .then(function(r){ return r.json(); })
  .then(function(d){ allSlots = d.slots; })
  .catch(function(){ allSlots = []; });
 
function selectVertical(el, name) {
  document.querySelectorAll('#chip-selector .cfe-chip').forEach(function(c){ c.classList.remove('selected'); });
  el.classList.add('selected');
  selectedVertical = name;
  setTimeout(function(){
    document.getElementById('chip-selector').style.display = 'none';
    show('s1-chosen', '✓ ' + name);
    markDone('s1');
    activateStep('s2');
    document.getElementById('s2-title').style.color = 'var(--neutral-900)';
    document.getElementById('s2-label').textContent = 'Step 2 — current';
    document.getElementById('s2-label').style.color = 'var(--neutral-600)';
    openCalendar();
  }, 180);
}
 
function openCalendar() {
  document.getElementById('s2-calendar').style.display = 'block';
  var now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth();
  renderScarcity();
  renderCalendar();
}
 
function renderScarcity() {
  var v = allSlots.filter(function(s){ return s.vertical === selectedVertical && s.available; });
  var urgent = v.filter(function(s){ return s.spots === 1; }).length;
  var line = document.getElementById('scarcity-line');
  line.textContent = urgent > 0
    ? urgent + ' slot' + (urgent > 1 ? 's' : '') + ' with only 1 spot left in ' + selectedVertical
    : v.length + ' available slots for ' + selectedVertical;
}
 
function renderCalendar() {
  document.getElementById('month-label').textContent = MONTHS[currentMonth] + ' ' + currentYear;
  var headers = document.getElementById('cal-headers');
  headers.innerHTML = '';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){
    var h = document.createElement('div'); h.className = 'cal-day-header'; h.textContent = d; headers.appendChild(h);
  });
  var body = document.getElementById('cal-body');
  body.innerHTML = '';
  var first = new Date(currentYear, currentMonth, 1);
  var startDow = (first.getDay() + 6) % 7;
  var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  var today = new Date();
  var monthStr = currentYear + '-' + pad(currentMonth + 1);
  var slotDates = {};
  allSlots.forEach(function(s){
    if (s.date.startsWith(monthStr) && s.available && (!selectedVertical || s.vertical === selectedVertical)) {
      if (!slotDates[s.date]) slotDates[s.date] = 999;
      slotDates[s.date] = Math.min(slotDates[s.date], s.spots);
    }
  });
  for (var i = 0; i < startDow; i++) {
    var e = document.createElement('div'); e.className = 'cal-day other-month'; body.appendChild(e);
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var ds = currentYear + '-' + pad(currentMonth + 1) + '-' + pad(d);
    var isPast = new Date(currentYear, currentMonth, d) < new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var cell = document.createElement('div');
    cell.textContent = d;
    if (slotDates[ds] !== undefined && !isPast) {
      cell.className = 'cal-day has-slot' + (slotDates[ds] === 1 ? ' urgent' : '');
      if (ds === selectedDate) cell.classList.add('selected-day');
      (function(date){ cell.onclick = function(){ selectDate(date); }; })(ds);
    } else {
      cell.className = 'cal-day' + (isPast ? ' other-month' : '');
    }
    body.appendChild(cell);
  }
}
 
function changeMonth(dir) {
  currentMonth += dir;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  selectedDate = ''; selectedTime = '';
  document.getElementById('time-picker').style.display = 'none';
  document.getElementById('confirm-area').style.display = 'none';
  renderCalendar();
}
 
function selectDate(ds) {
  selectedDate = ds; selectedTime = '';
  renderCalendar();
  var daySlots = allSlots.filter(function(s){ return s.date === ds && s.available && (!selectedVertical || s.vertical === selectedVertical); });
  var parts = ds.split('-');
  document.getElementById('time-picker-label').textContent = 'Available times on ' + parseInt(parts[2]) + ' ' + MONTHS_SHORT[parseInt(parts[1])-1];
  var container = document.getElementById('time-slots');
  container.innerHTML = '';
  daySlots.forEach(function(s){
    var btn = document.createElement('div');
    btn.className = 'time-slot';
    btn.innerHTML = s.time + '<span class="spots' + (s.spots === 1 ? ' urgent' : '') + '">' + s.spots + ' left</span>';
    (function(slot, el){ el.onclick = function(){ selectTime(slot, el); }; })(s, btn);
    container.appendChild(btn);
  });
  document.getElementById('time-picker').style.display = 'block';
  document.getElementById('confirm-area').style.display = 'none';
}
 
function selectTime(slot, btn) {
  selectedTime = slot.time;
  document.querySelectorAll('.time-slot').forEach(function(t){ t.classList.remove('selected-time'); });
  btn.classList.add('selected-time');
  var parts = selectedDate.split('-');
  document.getElementById('confirm-summary').textContent = slot.vertical + ' · ' + parseInt(parts[2]) + ' ' + MONTHS[parseInt(parts[1])-1] + ' ' + parts[0] + ' at ' + slot.time;
  document.getElementById('confirm-area').style.display = 'block';
}
 
function confirmBooking() {
  document.getElementById('s2-calendar').style.display = 'none';
  var parts = selectedDate.split('-');
  show('s2-chosen', '✓ ' + parseInt(parts[2]) + ' ' + MONTHS_SHORT[parseInt(parts[1])-1] + ' at ' + selectedTime + ' — ' + selectedVertical);
  markDone('s2');
  activateStep('s3');
  document.getElementById('s3-title').style.color = 'var(--neutral-900)';
}
 
function markDone(id) {
  var c = document.getElementById(id + '-circle');
  c.className = 'cfe-step-circle cfe-step-circle--done';
  c.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7L5.5 10L11.5 4" stroke="var(--blue-700)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var line = document.getElementById(id + '-line');
  if (line) line.className = 'cfe-connector cfe-connector--active';
  var lbl = document.getElementById(id + '-label');
  if (lbl) { lbl.textContent = 'Step ' + id.replace('s','') + ' — done'; lbl.style.color = 'var(--blue-700)'; }
}
function activateStep(id) {
  var c = document.getElementById(id + '-circle');
  c.className = 'cfe-step-circle cfe-step-circle--active';
  c.innerHTML = '<div style="width:10px;height:10px;border-radius:50%;background:var(--neutral-900);"></div>';
}
function show(id, text) {
  var el = document.getElementById(id); el.textContent = text; el.style.display = 'block';
}
function pad(n) { return String(n).padStart(2,'0'); }
</script>
