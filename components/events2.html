<script>
// ── Helpers ──────────────────────────────────────────────────────────────────

function evEsc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function evTagClass(tag) {
  if (tag === 'Free') return 'etag--free';
  if (tag === 'Paid') return 'etag--coral';
  if (['Workshop','Conference','Meetup','Concert','Community','Outdoor','Music'].includes(tag)) return 'etag--blue';
  if (['Online','In-Person','Hybrid'].includes(tag)) return 'etag--teal';
  return '';
}

function evInitials(v) {
  if (!v) return '?';
  if (v.length <= 3 && !v.includes('/')) return v.toUpperCase();
  var parts = v.split('/').pop().split('.')[0].split(/[-_ ]+/);
  return parts.filter(Boolean).map(function(p){ return p[0].toUpperCase(); }).slice(0,2).join('') || '?';
}

function evAvatarHtml(value) {
  if (!value || value === 'PH') return '<span class="avatar">+</span>';
  var ini = evInitials(value);
  return '<span class="avatar"><img src="' + value + '" alt="" loading="lazy" '
    + 'onerror="this.remove();this.parentNode.textContent=\'' + ini + '\'"></span>';
}

// ── Rich evh card builder ─────────────────────────────────────────────────────

function buildEvhCard(ev) {
  var d = ev.data || {};
  var slot = parseEventSlot(d.event_slot); // from _loader.js
  var valid = slot && !isNaN(slot.getTime());

  var day     = valid ? slot.toLocaleDateString('en-US',{timeZone:'America/New_York',day:'2-digit'}) : '';
  var month   = valid ? slot.toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short'}).toUpperCase() : '';
  var weekday = valid ? slot.toLocaleDateString('en-US',{timeZone:'America/New_York',weekday:'short'}).toUpperCase() : '';
  var time    = valid ? slot.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hour12:false}) : '';

  var going     = d.going || 0;
  var moreCount = Math.max(0, going - (d.avatars ? d.avatars.length : 0));
  var price     = d.price === 0 ? 'Free' : (d.price ? '$' + d.price : '');

  var tags = (ev.tags || []).map(function(t) {
    return '<span class="etag ' + evTagClass(t) + '">' + t + '</span>';
  }).join('');

  var avatars = (d.avatars || []).map(evAvatarHtml).join('');

  var calBtn     = d.calendar && d.calendar.google
    ? '<a class="btn-ev-cal" href="' + evEsc(d.calendar.google) + '" target="_blank" rel="noopener">Add to Calendar</a>' : '';
  var regBtn     = d.registerUrl
    ? '<a class="btn-ev-register" href="' + evEsc(d.registerUrl) + '" target="_blank" rel="noopener">Register</a>' : '';
  var connectBtn = d.connectUrl
    ? '<a class="btn-ev-connect" href="' + evEsc(d.connectUrl) + '" target="_blank" rel="noopener">Connect</a>' : '';
  var titleLink  = d.registerUrl
    ? '<a href="' + evEsc(d.registerUrl) + '" target="_blank" rel="noopener">' + evEsc(ev.title) + '</a>'
    : evEsc(ev.title);

  return [
    '<div class="card event-card evh evh--v1 mb-3"',
    ' data-content-category="' + evEsc(ev.content_category || '') + '"',
    ' data-audience="' + evEsc(ev.audience || 'default') + '">',
      '<div class="evh__img">',
        '<img src="' + evEsc(ev.image || '') + '" alt="' + evEsc(ev.title) + '">',
        '<div class="evh__img-overlay"></div>',
        '<div class="event-card__date">',
          '<span class="event-card__date-day">' + day + '</span>',
          '<span class="event-card__date-month">' + month + '</span>',
        '</div>',
      '</div>',
      '<div class="evh__body">',
        '<div class="evh__title-row">',
          '<h3 class="evh__title">' + titleLink + '</h3>',
          '<div class="evh__tags">' + tags + '</div>',
        '</div>',
        '<p class="evh__desc">' + evEsc(ev.deck || '') + '</p>',
        '<div class="evh__meta">',
          valid ? '<div class="evh__meta-item">' + weekday + ', ' + month + ' ' + parseInt(day) + ' \u00b7 ' + time + '</div>' : '',
          d.location ? '<div class="evh__meta-item">' + evEsc(d.location) + '</div>' : '',
          going ? '<div class="evh__meta-item">' + going + ' going</div>' : '',
        '</div>',
        '<div class="evh__footer">',
          '<div class="evh__btns">' + calBtn + regBtn + connectBtn + '</div>',
          '<div class="avatar-stack">',
            avatars,
            moreCount > 0 ? '<span class="avatar avatar-more">+' + moreCount + '</span>' : '',
            going ? '<span class="av-label">' + going + ' going</span>' : '',
          '</div>',
        '</div>',
      '</div>',
    '</div>'
  ].join('');
}

// ── Load and render ───────────────────────────────────────────────────────────

function loadEventsPage() {
  loadDb().then(function(db) { // loadDb from _loader.js
    var events = db.filter(function(d) {
      return d.doctype === 'webpage' && d.category === 'event' && d.docstatus === 1;
    }).sort(function(a, b) {
      return parseEventSlot(a.data && a.data.event_slot)  // parseEventSlot from _loader.js
           - parseEventSlot(b.data && b.data.event_slot);
    });

    var container = document.getElementById('events-container');
    container.innerHTML = events.length
      ? events.map(buildEvhCard).join('')
      : '<div class="text-muted py-4">No upcoming events.</div>';
  });
}

// ── Chip filter for evh cards ─────────────────────────────────────────────────
// _loader.js initChipFilter covers .ed-card — extend it for .event-card here

document.addEventListener('click', function(e) {
  var pill = e.target.closest('[data-filter].ed-topic-pill');
  if (!pill) return;
  var filter = pill.getAttribute('data-filter');

  // re-apply active after _loader.js removes it
  setTimeout(function() {
    document.querySelectorAll('[data-filter].ed-topic-pill')
      .forEach(function(p) { p.classList.remove('ed-topic-pill--active'); });
    pill.classList.add('ed-topic-pill--active');

    document.querySelectorAll('.event-card').forEach(function(card) {
      var cat = card.getAttribute('data-content-category');
      card.style.display = (filter === 'all' || cat === filter) ? '' : 'none';
    });
  }, 0);
});

document.addEventListener('DOMContentLoaded', loadEventsPage);
</script>
