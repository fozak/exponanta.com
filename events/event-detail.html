<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO meta filled by Alpine after load -->
<title>Event | Exponanta</title>
<meta name="description" content="Join this event in the Boston-Cambridge innovation community.">
<meta name="robots" content="index, follow">

<meta property="og:type" content="event">
<meta property="og:site_name" content="Exponanta">

<link rel="icon" type="image/svg+xml" href="https://exponanta.com/brandbook/favicon.svg">
<link rel="preconnect" href="https://rsms.me">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
<link rel="stylesheet" href="..//assets/added.css">
</head>

<body>

<!-- Navbar -->
<div x-data x-init="fetch('../../components/navbar.html').then(r=>r.text()).then(h=>$el.innerHTML=h)"></div>

<div class="page-wrapper">
  <div class="page-body">
    <div class="container-xl py-4" x-data="eventDetailApp()" x-init="init()">

      <!-- Loading state -->
      <div x-show="loading" class="row g-4">
        <div class="col-lg-8">
          <div class="placeholder ratio ratio-16x9 mb-4"></div>
          <div class="placeholder col-8 mb-2" style="height:2rem;"></div>
          <div class="placeholder col-6 mb-4"></div>
          <div class="placeholder col-12 mb-2"></div>
          <div class="placeholder col-10"></div>
        </div>
        <div class="col-lg-4">
          <div class="card"><div class="card-body"><div class="placeholder col-12 mb-2"></div><div class="placeholder col-8"></div></div></div>
        </div>
      </div>

      <!-- Error state -->
      <div x-show="!loading && !event" class="empty py-5">
        <div class="empty-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        <p class="empty-title">Event not found</p>
        <p class="empty-subtitle text-muted">This event may have been removed or the URL is incorrect.</p>
        <div class="empty-action"><a href="/events/" class="btn btn-primary">Browse all events</a></div>
      </div>

      <!-- Event content -->
      <div x-show="!loading && event" class="row g-4 align-items-start">

        <!-- Main column -->
        <div class="col-lg-8 col-md-12">

          <!-- Breadcrumb -->
          <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item"><a href="/events/">Events</a></li>
            <li class="breadcrumb-item active" x-text="event?.title"></li>
          </ol>

          <!-- Hero image -->
          <div class="ratio ratio-16x9 rounded overflow-hidden mb-4 bg-blue-lt" x-show="event">
            <img :src="imgSrc()"
                 :alt="event?.title"
                 class="object-fit-cover w-100 h-100"
                 data-img-step="0"
                 @error="imgError($event)">
          </div>

          <!-- Tags -->
          <div class="d-flex flex-wrap gap-2 mb-3" x-show="event?.tags?.length">
            <template x-for="tag in (event?.tags || [])" :key="tag">
              <span class="badge" :class="tagClass(tag)" x-text="tag"></span>
            </template>
          </div>

          <!-- Title -->
          <h1 class="fw-bold mb-3" x-text="event?.title"></h1>

          <!-- Deck -->
          <p class="lead text-muted mb-4" x-text="event?.deck"></p>

          <!-- Event meta card -->
          <div class="card mb-4" x-show="event">
            <div class="card-body p-0">
              <div class="divide-y">

                <!-- Date & time -->
                <div class="row px-3 py-3 align-items-center g-2">
                  <div class="col-auto">
                    <span class="avatar bg-blue-lt text-blue">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                    </span>
                  </div>
                  <div class="col">
                    <div class="text-muted small">Date &amp; Time</div>
                    <div class="fw-semibold" x-text="formatSlot(event?.data?.event_slot)"></div>
                  </div>
                </div>

                <!-- Location -->
                <div class="row px-3 py-3 align-items-center g-2">
                  <div class="col-auto">
                    <span class="avatar bg-blue-lt text-blue">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    </span>
                  </div>
                  <div class="col">
                    <div class="text-muted small">Location</div>
                    <div class="fw-semibold">
                      <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(event?.data?.location || '')"
                         target="_blank" rel="noopener" class="text-reset"
                         x-text="event?.data?.location"></a>
                    </div>
                  </div>
                </div>

                <!-- Presenter -->
                <div class="row px-3 py-3 align-items-center g-2" x-show="event?.data?.presenter">
                  <div class="col-auto">
                    <span class="avatar bg-blue-lt text-blue">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </span>
                  </div>
                  <div class="col">
                    <div class="text-muted small">Presenter</div>
                    <div class="fw-semibold" x-text="event?.data?.presenter"></div>
                  </div>
                </div>

                <!-- Going -->
                <div class="row px-3 py-3 align-items-center g-2">
                  <div class="col-auto">
                    <span class="avatar bg-blue-lt text-blue">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                    </span>
                  </div>
                  <div class="col">
                    <div class="text-muted small">Attendees</div>
                    <div class="d-flex align-items-center gap-2">
                      <div class="avatar-list avatar-list-stacked">
                        <template x-for="(av, i) in (event?.data?.avatars || []).slice(0,4)" :key="i">
                          <span class="avatar avatar-sm">
                            <template x-if="isImgPath(av)">
                              <img :src="av" @error="$event.target.parentNode.textContent=getInitials(av)">
                            </template>
                            <template x-if="!isImgPath(av)">
                              <span x-text="av"></span>
                            </template>
                          </span>
                        </template>
                      </div>
                      <span class="text-muted small" x-text="(event?.data?.going || 0) + ' going'"></span>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- Action buttons -->
          <div class="row g-3 mb-4" x-show="event">
            <div class="col-12 col-sm-auto">
              <a :href="event?.data?.calendar?.google || '#'"
                 target="_blank" rel="noopener"
                 class="btn btn-outline-secondary w-100">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                Add to Calendar
              </a>
            </div>
            <div class="col-12 col-sm-auto">
              <a :href="confirmUrl()"
                 class="btn btn-outline-primary w-100">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-1"><path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-1.99 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2z"/></svg>
                Register
              </a>
            </div>
            <div class="col-12 col-sm-auto">
              <a :href="event?.data?.connectUrl || '#'"
                 target="_blank" rel="noopener"
                 class="btn btn-primary w-100">
                Connect
              </a>
            </div>
          </div>

          <!-- Bottom CTA -->
          <div x-data x-init="fetch('../../components/bottom-cta.html').then(r=>r.text()).then(h=>$el.innerHTML=h)" class="mt-4"></div>

        </div>

        <!-- Sidebar -->
        <div class="col-lg-4 col-md-12 sidebar-sticky">
          <div x-data x-init="fetch('../../components/cta-sidebar.html').then(r=>r.text()).then(h=>$el.innerHTML=h)"></div>
          <div x-data x-init="fetch('../../components/stats-card.html').then(r=>r.text()).then(h=>$el.innerHTML=h)"></div>
          <div x-data x-init="fetch('../../components/industry-sidebar.html').then(r=>r.text()).then(h=>$el.innerHTML=h)"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<div x-data x-init="fetch('../../components/footer.html').then(r=>r.text()).then(h=>$el.innerHTML=h)"></div>

<script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script>
function eventDetailApp() {
  return {
    event: null,
    loading: true,

    async init() {
      try {
        // Derive page_name from URL: /events/thursday-gathering-march-26-2026.html → thursday-gathering-march-26-2026
        /*const parts = window.location.pathname.split('/');
        const slug = parts[parts.length - 1].replace(/\.html$/, ''); */
        const slug = new URLSearchParams(window.location.search).get('slug') || '';

        const res = await fetch('/data/db.json');
        const data = await res.json();
        const raw = Array.isArray(data) ? data : [];
        this.event = raw.find(e => e.page_name === slug && e.category === 'event') || null;

        if (this.event) {
          document.title = this.event.title + ' | Exponanta';
          document.querySelector('meta[name="description"]')
            ?.setAttribute('content', this.event.deck || '');
        }
      } catch (err) {
        console.error('Event detail load error:', err);
      } finally {
        this.loading = false;
      }
    },

    confirmUrl() {
      if (!this.event) return '#';
      return `/events/event-confirm.html?slug=${this.event.page_name}`;
    },

    imgSrc() {
      if (!this.event) return '';
      return this.event.image || `/images/${this.event.page_name}.png`;
    },

    imgError(e) {
      if (!this.event) return;
      const step = parseInt(e.target.dataset.imgStep || 0);
      const fallbacks = [
        `/images/${this.event.page_name}.jpg`,
        `/images/${this.event.content_category || 'default'}.png`,
        `/images/${this.event.content_category || 'default'}.jpg`,
      ];
      if (step < fallbacks.length) {
        e.target.src = fallbacks[step];
        e.target.dataset.imgStep = step + 1;
      } else {
        e.target.onerror = null;
        e.target.src = '';
      }
    },

    formatSlot(slot) {
      if (!slot) return '';
      try {
        const start = slot.split('/')[0];
        const dt = new Date(
          start.slice(0,4) + '-' + start.slice(4,6) + '-' + start.slice(6,8) + 'T' +
          start.slice(9,11) + ':' + start.slice(11,13) + ':00Z'
        );
        return dt.toLocaleDateString('en-US', {
          weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
          hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York'
        });
      } catch { return slot; }
    },

    tagClass(tag) {
      const map = {
        'Free':      'bg-green-lt text-green',
        'Community': 'bg-blue-lt text-blue',
        'In-Person': 'bg-teal-lt text-teal',
        'Online':    'bg-azure-lt text-azure',
        'Concert':   'bg-purple-lt text-purple',
        'Outdoor':   'bg-lime-lt text-lime',
      };
      return map[tag] || 'bg-secondary-lt text-secondary';
    },

    isImgPath(v) {
      return v && /\.(jpg|jpeg|png|webp|gif|svg)$/i.test(v);
    },

    getInitials(v) {
      if (!v) return '?';
      const file = v.split('/').pop().split('.')[0];
      return file.split(/[-_ ]+/).map(p => p[0]?.toUpperCase()).slice(0,2).join('') || '?';
    }
  };
}
</script>

</body>
</html>
