<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events Calendar | Exponanta</title>
  <meta name="description" content="Browse upcoming and past community events in Boston and Cambridge. Networking gatherings, concerts, workshops and more.">
  <link rel="canonical" href="https://exponanta.com/calendar.html">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Events Calendar | Exponanta">
  <meta property="og:description" content="Upcoming and past community events in Boston and Cambridge.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://exponanta.com/calendar.html">
  <link rel="icon" type="image/svg+xml" href="/brandbook/favicon.svg">

  <!-- Bootstrap 5 + Exponanta CSS stack -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/brandbook/exponanta.css" rel="stylesheet">
  <link href="/brandbook/exponanta-added.css" rel="stylesheet">

  <style>
    /* ── View toggle ── */
    .view-toggle {
      display: inline-flex;
      background: var(--neutral-50);
      border: 1px solid var(--bs-border-color);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 2px;
    }
    .view-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: 6px;
      font-size: var(--text-sm); font-weight: 600;
      border: none; background: transparent;
      color: var(--neutral-600); cursor: pointer; transition: all .15s;
    }
    .view-btn.active {
      background: var(--neutral-0); color: var(--blue-700);
      box-shadow: 0 1px 4px rgba(36,70,200,.12);
    }

    /* ── Month nav ── */
    .cal-month-nav { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cal-month-title {
      font-size: var(--text-xl); font-weight: 700;
      color: var(--neutral-900); min-width: 200px; text-align: center;
    }
    .cal-nav-btn {
      width: 34px; height: 34px; border-radius: var(--radius-md);
      border: 1.5px solid var(--bs-border-color); background: var(--neutral-0);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .15s; color: var(--neutral-600); flex-shrink: 0;
    }
    .cal-nav-btn:hover { border-color: var(--blue-700); color: var(--blue-700); background: var(--blue-100); }
    .cal-today-btn {
      padding: 5px 14px; border-radius: var(--radius-md);
      border: 1.5px solid var(--bs-border-color); background: var(--neutral-0);
      font-size: var(--text-sm); font-weight: 600; color: var(--neutral-600);
      cursor: pointer; transition: all .15s;
    }
    .cal-today-btn:hover { border-color: var(--blue-700); color: var(--blue-700); }

    /* ── Month grid ── */
    .cal-grid-wrap {
      background: var(--neutral-0); border: 1px solid var(--bs-border-color);
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow-sm); margin-bottom: 2rem;
    }
    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-bottom: 2px solid var(--bs-border-color); background: var(--neutral-50);
    }
    .cal-dow {
      padding: 10px 0; text-align: center;
      font-size: 11px; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--neutral-600);
      border-right: 1px solid var(--bs-border-color);
    }
    .cal-dow:last-child { border-right: none; }
    .cal-body-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-cell {
      min-height: 96px; border-right: 1px solid var(--bs-border-color);
      border-bottom: 1px solid var(--bs-border-color);
      padding: 6px 5px 4px; background: var(--neutral-0); box-sizing: border-box;
    }
    .cal-cell:nth-child(7n) { border-right: none; }
    .cal-cell--other { background: var(--neutral-50); }
    .cal-cell--today { background: rgba(36,70,200,.03); }
    .cal-day-num {
      font-size: 13px; font-weight: 600; color: var(--neutral-600);
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 3px;
    }
    .cal-cell--today .cal-day-num { background: var(--blue-700); color: var(--neutral-0); }
    .cal-cell--other .cal-day-num { color: #c8d0dc; }

    /* ── Pills ── */
    .cal-pill {
      display: block; width: 100%; padding: 2px 5px; border-radius: 4px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
      cursor: pointer; transition: opacity .12s; border: none;
      text-align: left; line-height: 1.6;
    }
    .cal-pill:hover { opacity: .75; }
    .cal-pill--Community  { background: rgba(36,70,200,.1); color: var(--blue-700); }
    .cal-pill--Concert    { background: rgba(79,209,197,.18); color: #0e7a72; }
    .cal-pill--Workshop   { background: rgba(255,111,97,.14); color: #b33325; }
    .cal-pill--Conference { background: rgba(36,70,200,.1); color: var(--blue-700); }
    .cal-pill--default    { background: var(--neutral-50); color: var(--neutral-600); border: 1px solid var(--bs-border-color); }
    .cal-pill-more {
      font-size: 11px; color: var(--blue-700); font-weight: 600;
      cursor: pointer; padding-left: 2px; display: block;
      border: none; background: none; text-align: left;
    }

    /* ── Legend ── */
    .cal-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--neutral-600); align-items: center; }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; }
    .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    /* ── Popup ── */
    .cal-popup {
      display: none; position: fixed; z-index: 9999;
      background: var(--neutral-0); border: 1px solid var(--bs-border-color);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      width: 310px; padding: 16px 18px;
    }
    .cal-popup.show { display: block; }
    .cal-popup-close {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none; font-size: 18px;
      color: var(--neutral-600); cursor: pointer; line-height: 1; padding: 2px 6px;
    }

    /* ── Tag filter pills ── */
    .tag-filter-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag-pill {
      padding: 4px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1.5px solid var(--bs-border-color); background: var(--neutral-0);
      color: var(--neutral-600); cursor: pointer; transition: all .15s;
    }
    .tag-pill.active, .tag-pill:hover {
      border-color: var(--blue-700); color: var(--blue-700);
      background: rgba(36,70,200,.07);
    }
    .tag-pill.active { background: rgba(36,70,200,.1); }

    /* ── Event card (Bootstrap card + exponanta tokens) ── */
    .ev-card {
      border: 1px solid var(--bs-border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--neutral-0);
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, transform .2s;
      height: 100%;
    }
    .ev-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    .ev-card__img {
      position: relative; height: 180px; overflow: hidden;
    }
    .ev-card__img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .3s;
    }
    .ev-card:hover .ev-card__img img { transform: scale(1.04); }

    .ev-card__date-badge {
      position: absolute; top: 12px; left: 12px;
      background: var(--neutral-0); border-radius: var(--radius-md);
      padding: 6px 10px; text-align: center; min-width: 44px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .ev-card__date-day { display: block; font-size: 1.25rem; font-weight: 800; color: var(--blue-700); line-height: 1; }
    .ev-card__date-mon { display: block; font-size: .65rem; font-weight: 700; text-transform: uppercase; color: var(--neutral-600); letter-spacing: .06em; }

    .ev-card__status {
      position: absolute; top: 12px; right: 12px;
      font-size: 11px; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: .06em;
    }
    .ev-card__status--upcoming { background: rgba(36,70,200,.9); color: #fff; }
    .ev-card__status--sold-out { background: rgba(240,82,82,.9); color: #fff; }
    .ev-card__status--free     { background: rgba(79,209,197,.9); color: #064e4b; }

    .ev-card__body { padding: 16px; display: flex; flex-direction: column; gap: 8px; }

    .ev-card__tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .ev-card__tag {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: .05em;
    }
    .ev-card__tag--Community  { background: rgba(36,70,200,.1); color: var(--blue-700); }
    .ev-card__tag--Concert    { background: rgba(79,209,197,.2); color: #0e7a72; }
    .ev-card__tag--Workshop   { background: rgba(255,111,97,.15); color: #b33325; }
    .ev-card__tag--Free       { background: rgba(79,209,197,.2); color: #0e7a72; }
    .ev-card__tag--default    { background: var(--neutral-50); color: var(--neutral-600); }

    .ev-card__title {
      font-size: var(--text-md); font-weight: 700;
      color: var(--neutral-900); line-height: 1.3;
      margin: 0; text-decoration: none;
    }
    .ev-card__title:hover { color: var(--blue-700); }

    .ev-card__meta {
      font-size: 12px; color: var(--neutral-600);
      display: flex; flex-direction: column; gap: 3px;
    }
    .ev-card__meta-row { display: flex; align-items: center; gap: 5px; }

    .ev-card__desc {
      font-size: var(--text-sm); color: var(--neutral-600);
      line-height: 1.5; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      margin: 0;
    }

    .ev-card__footer {
      display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
      padding-top: 8px; border-top: 1px solid var(--bs-border-color);
      flex-wrap: wrap; margin-top: auto;
    }

    .ev-card__avatars { display: flex; align-items: center; gap: 4px; }
    .ev-card__avatar {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid var(--neutral-0);
      margin-left: -6px; object-fit: cover;
      background: var(--blue-100); color: var(--blue-700);
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .ev-card__avatar:first-child { margin-left: 0; }
    .ev-card__going { font-size: 11px; color: var(--neutral-600); font-weight: 600; }

    .ev-card__btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .ev-card__btn-reg {
      font-size: 12px; font-weight: 700; padding: 5px 14px;
      border-radius: var(--radius-md); border: none;
      background: var(--blue-700); color: #fff;
      text-decoration: none; cursor: pointer; transition: background .15s;
    }
    .ev-card__btn-reg:hover { background: #1a38a0; color: #fff; }
    .ev-card__btn-cal {
      font-size: 12px; font-weight: 600; padding: 5px 12px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--bs-border-color);
      background: var(--neutral-0); color: var(--neutral-600);
      text-decoration: none; cursor: pointer; transition: all .15s;
    }
    .ev-card__btn-cal:hover { border-color: var(--blue-700); color: var(--blue-700); }

    /* ── Past event card (compact horizontal) ── */
    .past-card {
      display: flex; gap: 16px;
      border: 1px solid var(--bs-border-color);
      border-radius: var(--radius-lg);
      background: var(--neutral-0);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s;
    }
    .past-card:hover { box-shadow: var(--shadow-md); }
    .past-card__img {
      width: 80px; height: 80px; flex-shrink: 0;
      border-radius: var(--radius-md); overflow: hidden;
    }
    .past-card__img img { width: 100%; height: 100%; object-fit: cover; }
    .past-card__body { flex: 1; min-width: 0; }
    .past-card__title {
      font-size: var(--text-sm); font-weight: 700;
      color: var(--neutral-900); margin: 0 0 4px; line-height: 1.3;
    }
    .past-card__meta {
      font-size: 11px; color: var(--neutral-600); margin-bottom: 6px;
    }
    .past-card__badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; text-transform: uppercase; letter-spacing: .06em;
      background: var(--neutral-50); color: var(--neutral-600);
      border: 1px solid var(--bs-border-color);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--neutral-600); font-size: var(--text-sm);
    }
    .empty-state svg { opacity: .35; margin-bottom: 12px; }

    /* ── Responsive ── */
    @media (max-width: 576px) {
      .cal-cell { min-height: 60px; }
      .cal-pill { display: none; }
      .cal-cell.has-events .cal-day-num { background: var(--blue-100); color: var(--blue-700); border-radius: 50%; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<div id="navbar" data-loader="/components/navbar.html"></div>

<!-- MAIN -->
<main id="main-content" class="container py-5">

  <!-- Page header -->
  <div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-4">
    <div>
      <h1 class="mb-1" style="font-size:var(--text-2xl);font-weight:700;color:var(--neutral-900);">Events Calendar</h1>
      <p class="text-muted mb-0" style="font-size:var(--text-sm);">Upcoming and past community events · Boston &amp; Cambridge</p>
    </div>
    <div class="view-toggle" role="group" aria-label="View mode">
      <button class="view-btn active" data-view="calendar">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Calendar
      </button>
      <button class="view-btn" data-view="list">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        List
      </button>
    </div>
  </div>

  <!-- ═══════════════════ CALENDAR VIEW ═══════════════════ -->
  <div id="view-calendar">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <div class="cal-month-nav">
        <button class="cal-nav-btn" id="cal-prev" aria-label="Previous month">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="cal-month-title" id="cal-month-title"></div>
        <button class="cal-nav-btn" id="cal-next" aria-label="Next month">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="cal-today-btn" id="cal-today">Today</button>
      </div>
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(36,70,200,.12)"></div>Community</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(79,209,197,.22)"></div>Concert</div>
        <div class="cal-legend-item"><div class="cal-legend-dot" style="background:rgba(255,111,97,.18)"></div>Workshop</div>
      </div>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-dow-row">
        <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
        <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div>
        <div class="cal-dow">Sat</div>
      </div>
      <div class="cal-body-grid" id="cal-body"></div>
    </div>
  </div>

  <!-- ═══════════════════ LIST VIEW ═══════════════════ -->
  <div id="view-list" style="display:none;">

    <!-- Tag filters -->
    <div class="tag-filter-wrap mb-4" id="tag-filters">
      <button class="tag-pill active" data-tag="all">All</button>
    </div>

    <!-- Upcoming -->
    <h2 class="mb-3" style="font-size:var(--text-xl);font-weight:700;color:var(--neutral-900);">Upcoming Events</h2>
    <div class="row g-3 mb-5" id="upcoming-container">
      <div class="empty-state col-12">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <p>Loading events…</p>
      </div>
    </div>

    <!-- Past -->
    <h2 class="mb-3" style="font-size:var(--text-xl);font-weight:700;color:var(--neutral-900);">Past Events</h2>
    <div class="row g-3" id="past-container"></div>

  </div>

</main>

<!-- Popup -->
<div class="cal-popup" id="cal-popup" role="dialog" aria-modal="true">
  <button class="cal-popup-close" id="cal-popup-close" aria-label="Close">×</button>
  <div id="cal-popup-tag" style="margin-bottom:8px;"></div>
  <div id="cal-popup-title" style="font-weight:700;font-size:var(--text-md);margin-bottom:6px;margin-right:20px;line-height:1.3;"></div>
  <div id="cal-popup-date" style="font-size:12px;color:var(--neutral-600);margin-bottom:3px;display:flex;align-items:center;gap:5px;"></div>
  <div id="cal-popup-loc"  style="font-size:12px;color:var(--neutral-600);margin-bottom:10px;display:flex;align-items:center;gap:5px;"></div>
  <div id="cal-popup-desc" style="font-size:13px;color:var(--neutral-600);line-height:1.5;margin-bottom:12px;"></div>
  <div id="cal-popup-btns" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
</div>

<!-- FOOTER -->
<div id="footer" data-loader="/components/footer.html"></div>

<script>
/* =====================================================
   EVENTS CALENDAR — reads /data/db.json
   Supports both schemas:
     • old events.json  → id: "event03052618", flat fields
     • new db.json      → category:"event", data.event_slot, page_name
   ===================================================== */
(function () {

  const DB_URL     = "/data/db.json";
  const MONTHS_SH  = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const MONTHS_LG  = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS_SH    = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  let allEvents = [];
  let activeTag = "all";
  let calYear   = new Date().getFullYear();
  let calMonth  = new Date().getMonth();

  /* ── Escape HTML ── */
  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  /* ── Normalise event from either schema ── */
  function normalise(raw) {
    /* new db.json schema */
    if (raw.doctype === "webpage" || raw.page_name) {
      const d    = raw.data || {};
      const slot = d.event_slot || "";            // "20260319T220000Z/20260320T000000Z"
      const ts   = slot ? new Date(slot.split("/")[0]).getTime() : 0;
      const dt   = ts ? new Date(ts) : null;
      return {
        _ts:       ts,
        id:        raw.page_name || raw.name,
        title:     raw.title || "",
        desc:      raw.deck  || "",
        image:     raw.image || "",
        tags:      raw.tags  || [],
        location:  d.location || raw.kicker || "",
        going:     d.going   || 0,
        avatars:   d.avatars || [],
        status:    d.status  || "upcoming",
        registerUrl: d.registerUrl  || "",
        calGoogle:   d.calendar?.google || "",
        connectUrl:  d.connectUrl || "",
        url:       raw.url || (raw.page_name ? `/events/${raw.page_name}.html` : ""),
        dt,
      };
    }
    /* old events.json schema — id like "event03052618" */
    const m = String(raw.id || "").match(/event(\d{2})(\d{2})(\d{2})(\d{2})/);
    let dt = null, ts = 0;
    if (m) {
      dt = new Date(2000 + parseInt(m[3]), parseInt(m[1]) - 1, parseInt(m[2]),
                    parseInt(m[4]), 0);
      ts = dt.getTime();
    }
    return {
      _ts:       ts,
      id:        raw.id,
      title:     raw.title || "",
      desc:      raw.description || "",
      image:     raw.image || "",
      tags:      raw.tags  || [],
      location:  raw.location || "",
      going:     raw.going || 0,
      avatars:   raw.avatars || [],
      status:    raw.status || "upcoming",
      registerUrl: raw.registerUrl || "",
      calGoogle:   raw.calendar?.google || "",
      connectUrl:  raw.connectUrl || "",
      url:       raw.url || "",
      dt,
    };
  }

  /* ── Tag pill class ── */
  function tagClass(t) {
    const m = { Community:"Community", Concert:"Concert", Workshop:"Workshop",
                Conference:"Conference", Free:"Free" };
    return "ev-card__tag--" + (m[t] || "default");
  }

  /* ── Calendar pill class ── */
  function pillClass(tags) {
    for (const t of ["Community","Concert","Workshop","Conference"])
      if (tags.includes(t)) return `cal-pill--${t}`;
    return "cal-pill--default";
  }

  /* ── Avatar HTML ── */
  function avatarHtml(a) {
    if (!a || a === "PH") {
      return `<span class="ev-card__avatar" style="background:var(--blue-100);color:var(--blue-700)">?</span>`;
    }
    if (/\.(jpg|jpeg|png|webp|gif|svg)$/i.test(a)) {
      const init = a.split("/").pop().split(".")[0].split(/[-_]/).map(p=>p[0]?.toUpperCase()||"").slice(0,2).join("");
      return `<span class="ev-card__avatar"><img src="${esc(a)}" alt="" onerror="this.parentNode.textContent='${init}'"></span>`;
    }
    return `<span class="ev-card__avatar">${esc(a.slice(0,2).toUpperCase())}</span>`;
  }

  /* ── Render upcoming card (3-col Bootstrap grid) ── */
  function renderUpcomingCard(ev) {
    const dt = ev.dt;
    const day = dt ? dt.getDate() : "–";
    const mon = dt ? MONTHS_SH[dt.getMonth()] : "–";
    const time = dt ? dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "";
    const weekday = dt ? DAYS_SH[dt.getDay()] : "";

    const tagsHtml = ev.tags.map(t =>
      `<span class="ev-card__tag ${tagClass(t)}">${esc(t)}</span>`
    ).join("");

    const statusHtml = ev.status && ev.status !== "upcoming"
      ? `<div class="ev-card__status ev-card__status--${esc(ev.status)}">${esc(ev.status)}</div>`
      : `<div class="ev-card__status ev-card__status--upcoming">Upcoming</div>`;

    const avatarsHtml = ev.avatars.slice(0, 4).map(avatarHtml).join("");
    const moreCount   = Math.max(0, (ev.going || 0) - (ev.avatars?.length || 0));

    const titleEl = ev.url
      ? `<a href="${esc(ev.url)}" class="ev-card__title">${esc(ev.title)}</a>`
      : `<div class="ev-card__title">${esc(ev.title)}</div>`;

    return `
<div class="col-12 col-md-6 col-lg-4">
  <div class="ev-card">
    <div class="ev-card__img">
      <img src="${esc(ev.image)}" alt="${esc(ev.title)}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/400x180?text=Event'">
      <div class="ev-card__date-badge">
        <span class="ev-card__date-day">${day}</span>
        <span class="ev-card__date-mon">${mon}</span>
      </div>
      ${statusHtml}
    </div>
    <div class="ev-card__body">
      <div class="ev-card__tags">${tagsHtml}</div>
      ${titleEl}
      <p class="ev-card__desc">${esc(ev.desc)}</p>
      <div class="ev-card__meta">
        ${dt ? `<div class="ev-card__meta-row">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          ${weekday}, ${mon} ${day} · ${time}
        </div>` : ""}
        ${ev.location ? `<div class="ev-card__meta-row">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
          </svg>
          ${esc(ev.location)}
        </div>` : ""}
      </div>
      <div class="ev-card__footer">
        <div class="ev-card__avatars">
          ${avatarsHtml}
          ${moreCount > 0 ? `<span class="ev-card__avatar">+${moreCount}</span>` : ""}
          ${ev.going ? `<span class="ev-card__going">&nbsp;${ev.going} going</span>` : ""}
        </div>
        <div class="ev-card__btns">
          ${ev.calGoogle ? `<a href="${esc(ev.calGoogle)}" target="_blank" rel="noopener" class="ev-card__btn-cal">+ Cal</a>` : ""}
          ${ev.registerUrl ? `<a href="${esc(ev.registerUrl)}" target="_blank" rel="noopener" class="ev-card__btn-reg">Register</a>` : ""}
        </div>
      </div>
    </div>
  </div>
</div>`;
  }

  /* ── Render past card (compact horizontal) ── */
  function renderPastCard(ev) {
    const dt  = ev.dt;
    const mon = dt ? MONTHS_SH[dt.getMonth()] : "";
    const day = dt ? dt.getDate() : "";
    const yr  = dt ? dt.getFullYear() : "";
    return `
<div class="col-12 col-md-6">
  <div class="past-card">
    <div class="past-card__img">
      <img src="${esc(ev.image)}" alt="${esc(ev.title)}" loading="lazy"
           onerror="this.src='https://via.placeholder.com/80x80?text=E'">
    </div>
    <div class="past-card__body">
      <div class="past-card__title">${esc(ev.title)}</div>
      <div class="past-card__meta">${mon} ${day}, ${yr} · ${esc(ev.location)}</div>
      <span class="past-card__badge">Completed · ${ev.going || ev.attendees || 0} attended</span>
    </div>
  </div>
</div>`;
  }

  /* ── Render tag filter pills ── */
  function buildTagFilters(events) {
    const tags = new Set();
    events.forEach(ev => (ev.tags||[]).forEach(t => tags.add(t)));
    const wrap = document.getElementById("tag-filters");
    if (!wrap) return;
    wrap.innerHTML = `<button class="tag-pill active" data-tag="all">All</button>`;
    [...tags].sort().forEach(t => {
      const btn = document.createElement("button");
      btn.className = "tag-pill"; btn.dataset.tag = t; btn.textContent = t;
      btn.addEventListener("click", () => { activeTag = t; applyFilter(); updateTagUI(); });
      wrap.appendChild(btn);
    });
    wrap.querySelector("[data-tag='all']").addEventListener("click", () => {
      activeTag = "all"; applyFilter(); updateTagUI();
    });
  }

  function updateTagUI() {
    document.querySelectorAll(".tag-pill").forEach(p =>
      p.classList.toggle("active", p.dataset.tag === activeTag));
  }

  function applyFilter() {
    const now = Date.now();
    const filtered = activeTag === "all"
      ? allEvents
      : allEvents.filter(ev => (ev.tags||[]).includes(activeTag));

    const upcoming = filtered.filter(ev => ev._ts >= now);
    const past     = filtered.filter(ev => ev._ts  < now);

    upcoming.sort((a,b) => a._ts - b._ts);
    past.sort(    (a,b) => b._ts - a._ts);

    const upEl = document.getElementById("upcoming-container");
    const paEl = document.getElementById("past-container");

    if (upEl) upEl.innerHTML = upcoming.length
      ? upcoming.map(renderUpcomingCard).join("")
      : `<div class="empty-state col-12"><p>No upcoming events.</p></div>`;

    if (paEl) paEl.innerHTML = past.length
      ? past.map(renderPastCard).join("")
      : `<div class="empty-state col-12"><p>No past events.</p></div>`;
  }

  /* ══════════════════════════════════════
     CALENDAR GRID
  ══════════════════════════════════════ */
  function buildGrid() {
    document.getElementById("cal-month-title").textContent =
      `${MONTHS_LG[calMonth]} ${calYear}`;

    const now    = new Date();
    const todayY = now.getFullYear(), todayM = now.getMonth(), todayD = now.getDate();
    const firstDow   = new Date(calYear, calMonth, 1).getDay();
    const daysInMon  = new Date(calYear, calMonth + 1, 0).getDate();
    const prevTotal  = new Date(calYear, calMonth, 0).getDate();

    /* index by day number */
    const byDay = {};
    allEvents.forEach(ev => {
      const dt = ev.dt;
      if (!dt || dt.getFullYear() !== calYear || dt.getMonth() !== calMonth) return;
      const d = dt.getDate();
      (byDay[d] = byDay[d] || []).push(ev);
    });

    const body = document.getElementById("cal-body");
    body.innerHTML = "";

    for (let i = 0; i < firstDow; i++)
      body.appendChild(makeCell(prevTotal - firstDow + 1 + i, true, false, []));

    for (let d = 1; d <= daysInMon; d++) {
      const isToday = calYear===todayY && calMonth===todayM && d===todayD;
      body.appendChild(makeCell(d, false, isToday, byDay[d] || []));
    }

    const filled   = firstDow + daysInMon;
    const trailing = filled % 7 === 0 ? 0 : 7 - (filled % 7);
    for (let i = 1; i <= trailing; i++)
      body.appendChild(makeCell(i, true, false, []));
  }

  function makeCell(dayNum, other, isToday, dayEvents) {
    const cell = document.createElement("div");
    cell.className = "cal-cell"
      + (other   ? " cal-cell--other" : "")
      + (isToday ? " cal-cell--today" : "")
      + (dayEvents.length ? " has-events" : "");

    const num = document.createElement("div");
    num.className = "cal-day-num";
    num.textContent = dayNum;
    cell.appendChild(num);

    if (!other) {
      const MAX = 2;
      dayEvents.slice(0, MAX).forEach(ev => {
        const dt  = ev.dt;
        const time = dt ? dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "";
        const btn  = document.createElement("button");
        btn.className = `cal-pill ${pillClass(ev.tags)}`;
        btn.textContent = (time ? time + " " : "") + ev.title;
        btn.title = ev.title;
        btn.addEventListener("click", e => { e.stopPropagation(); openPopup(ev, btn); });
        cell.appendChild(btn);
      });
      if (dayEvents.length > MAX) {
        const more = document.createElement("button");
        more.className = "cal-pill-more";
        more.textContent = `+${dayEvents.length - MAX} more`;
        more.addEventListener("click", () => switchView("list"));
        cell.appendChild(more);
      }
    }
    return cell;
  }

  /* ── Popup ── */
  function openPopup(ev, anchor) {
    const dt      = ev.dt;
    const weekday = dt ? DAYS_SH[dt.getDay()] : "";
    const mon     = dt ? MONTHS_SH[dt.getMonth()] : "";
    const day     = dt ? dt.getDate() : "";
    const time    = dt ? dt.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "";
    const tagName = ev.tags.find(t => ["Community","Concert","Workshop","Conference"].includes(t)) || ev.tags[0] || "Event";
    const tagColors = {Community:"rgba(36,70,200,.1)",Concert:"rgba(79,209,197,.2)",Workshop:"rgba(255,111,97,.15)"};
    const tagTextColors = {Community:"var(--blue-700)",Concert:"#0e7a72",Workshop:"#b33325"};

    document.getElementById("cal-popup-tag").innerHTML =
      `<span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:4px;
        background:${tagColors[tagName]||"var(--neutral-50)"};
        color:${tagTextColors[tagName]||"var(--neutral-600)"}">${esc(tagName)}</span>`;
    document.getElementById("cal-popup-title").textContent = ev.title;
    document.getElementById("cal-popup-date").innerHTML = dt
      ? `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
           <rect x="3" y="4" width="18" height="18" rx="2"/>
           <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
         </svg> ${weekday}, ${mon} ${day} · ${time}` : "";
    document.getElementById("cal-popup-loc").innerHTML = ev.location
      ? `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
           <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
         </svg> ${esc(ev.location)}` : "";
    document.getElementById("cal-popup-desc").textContent = ev.desc || "";

    const btns = document.getElementById("cal-popup-btns");
    btns.innerHTML = "";
    if (ev.registerUrl)
      btns.innerHTML += `<a href="${esc(ev.registerUrl)}" target="_blank" rel="noopener"
        class="ev-card__btn-reg">Register</a>`;
    if (ev.calGoogle)
      btns.innerHTML += `<a href="${esc(ev.calGoogle)}" target="_blank" rel="noopener"
        class="ev-card__btn-cal">Add to Calendar</a>`;

    const popup = document.getElementById("cal-popup");
    const rect  = anchor.getBoundingClientRect();
    let left = rect.left + window.scrollX;
    let top  = rect.bottom + window.scrollY + 6;
    if (left + 320 > window.innerWidth - 12) left = window.innerWidth - 322;
    if (top + 300 > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - 305;
    popup.style.left = Math.max(8, left) + "px";
    popup.style.top  = top + "px";
    popup.classList.add("show");
  }

  document.getElementById("cal-popup-close").addEventListener("click", () =>
    document.getElementById("cal-popup").classList.remove("show"));
  document.addEventListener("click", e => {
    const popup = document.getElementById("cal-popup");
    if (!popup.contains(e.target) && !e.target.classList.contains("cal-pill"))
      popup.classList.remove("show");
  });

  /* ── Month nav ── */
  document.getElementById("cal-prev").addEventListener("click", () => {
    if (--calMonth < 0) { calMonth = 11; calYear--; } buildGrid();
  });
  document.getElementById("cal-next").addEventListener("click", () => {
    if (++calMonth > 11) { calMonth = 0; calYear++; } buildGrid();
  });
  document.getElementById("cal-today").addEventListener("click", () => {
    calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); buildGrid();
  });

  /* ── View toggle ── */
  window.switchView = function (view) {
    document.querySelectorAll(".view-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.view === view));
    document.getElementById("view-calendar").style.display = view === "calendar" ? "" : "none";
    document.getElementById("view-list").style.display     = view === "list"     ? "" : "none";
  };
  document.querySelectorAll(".view-btn").forEach(btn =>
    btn.addEventListener("click", () => switchView(btn.dataset.view)));

  /* ══ LOAD DATA ══ */
  async function loadData() {
    try {
      const res  = await fetch(DB_URL);
      const data = await res.json();

      /* support both flat array and {items:[]} wrapper */
      const raw = Array.isArray(data) ? data : (data.items || []);

      /* filter to events only (db.json may contain people, blog posts, etc.) */
      allEvents = raw
        .filter(r => r.category === "event" || r.doctype === "webpage"
                  || String(r.id||"").startsWith("event"))
        .map(normalise)
        .filter(ev => ev._ts > 0 || ev.title);  /* drop empty */

      buildGrid();
      buildTagFilters(allEvents);
      applyFilter();

    } catch (err) {
      console.error("Events load error:", err);
      document.getElementById("upcoming-container").innerHTML =
        `<div class="empty-state col-12"><p>Events unavailable.</p></div>`;
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    buildGrid(); /* render empty grid immediately */
    loadData();
  });

})();
</script>

</body>
</html>
