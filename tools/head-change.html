<!--1. Remove all meta-tags, title and canonical-->

<!-- calculate real Title-->

const h1Title = document.querySelector("h1")?.textContent;
slug = const slug = document.querySelector("h1")?.textContent
  .trim()
  .toLowerCase()
  .replace(/\s+/g, "-");


<!-- add new title and meta tags and canonical -->
<title>{h1Title} | Exponanta</title>
<meta name="description" content="Comprehensive startup support programs, mentorship, and founder community. Join Startup Club, Startup Huddle, and FastTrac.">
<link rel="canonical" href="`https://exponanta.com/people/${slug}.html`">


<!--ADD Open Graph -->
<meta property="og:title" content="{h1Title} Startup Support Programs & Mentorship | Exponanta">
<meta property="og:description" content="{h1Title}, Structured startup programs, expert mentors, and founder community to help you succeed.">
<meta property="og:type" content="article">
<meta property="og:url" content="`https://exponanta.com/people/${slug}.html`">
<meta property="og:image" content=""`https://exponanta.com/images/${slug}.jpg`


<!-- ADD Favicon -->
<link rel="icon" type="image/svg+xml" href="https://exponanta.com/brandbook/favicon.svg">
