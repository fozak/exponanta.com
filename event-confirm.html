<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registration Confirmed | Exponanta</title>
<meta name="description" content="Your registration is confirmed. You're going to this event.">
<link rel="canonical" href="https://exponanta.com/event-confirm.html">
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/svg+xml" href="/brandbook/favicon.svg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/brandbook/exponanta.css" rel="stylesheet">
<link href="/brandbook/exponanta-added.css" rel="stylesheet">

<style>
/* =====================================================
   EVENT CONFIRM — only new CSS
   etag / avatar / btn-ev-* from exponanta-added.css
   ===================================================== */

/* ── Ticket card ── */
.ticket {
  max-width: 560px;
  margin: 0 auto;
  background: var(--neutral-0);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  overflow: hidden;
  border: 1px solid rgba(36,70,200,.10);
}

/* Ticket hero image strip */
.ticket__img {
  width: 100%; height: 200px; object-fit: cover; display: block;
}
.ticket__img-placeholder {
  width: 100%; height: 200px;
  background: linear-gradient(135deg, var(--blue-700) 0%, #1a35a0 100%);
}

/* Confirmed badge row */
.ticket__confirmed {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 24px 0;
}
.ticket__check {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(79,209,197,.15); color: #0e7a72;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ticket__confirmed-text {
  font-size: var(--text-sm); font-weight: 700;
  color: #0e7a72; letter-spacing: .3px;
}

/* Body */
.ticket__body { padding: 16px 24px 24px; }

.ticket__title {
  font-size: var(--text-xl); font-weight: 700;
  color: var(--neutral-900); line-height: 1.25;
  margin: 0 0 14px;
}

/* Detail rows */
.ticket__details {
  display: flex; flex-direction: column; gap: 10px;
  padding: 16px 0; border-top: 1px solid rgba(36,70,200,.08);
  border-bottom: 1px solid rgba(36,70,200,.08);
  margin-bottom: 20px;
}
.ticket__detail {
  display: flex; align-items: flex-start; gap: 12px;
  font-size: var(--text-sm); color: var(--neutral-600);
}
.ticket__detail-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--blue-100); color: var(--blue-700);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ticket__detail-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .5px; color: var(--neutral-600); margin-bottom: 2px;
}
.ticket__detail-value {
  font-weight: 600; color: var(--neutral-900); line-height: 1.3;
}

/* Ticket number / confirmation code */
.ticket__code {
  background: var(--neutral-50);
  border: 1.5px dashed rgba(36,70,200,.2);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; gap: 12px;
}
.ticket__code-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--neutral-600); margin-bottom: 3px;
}
.ticket__code-val {
  font-size: var(--text-md); font-weight: 800;
  color: var(--blue-700); letter-spacing: .5px; font-family: monospace;
}
.ticket__code-copy {
  padding: 6px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--blue-700); color: var(--blue-700);
  background: transparent; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.ticket__code-copy:hover { background: var(--blue-700); color: var(--neutral-0); }
.ticket__code-copy.copied { background: var(--accent-teal); border-color: var(--accent-teal); color: var(--neutral-0); }

/* Avatar stack on ticket */
.ticket__attendees {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px; font-size: var(--text-sm); color: var(--neutral-600);
}

/* CTA buttons */
.ticket__actions {
  display: flex; flex-direction: column; gap: 10px;
}

/* Tear line between body and footer */
.ticket__tear {
  position: relative; height: 28px; overflow: hidden;
  background: var(--neutral-50);
}
.ticket__tear::before,
.ticket__tear::after {
  content: '';
  position: absolute; top: 50%;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--page-bg, #f5f7fa);
  transform: translateY(-50%);
}
.ticket__tear::before { left: -14px; }
.ticket__tear::after  { right: -14px; }
.ticket__tear-line {
  position: absolute; top: 50%; left: 20px; right: 20px; height: 0;
  border-top: 2px dashed rgba(36,70,200,.15);
}

/* Ticket footer */
.ticket__footer {
  background: var(--neutral-50);
  padding: 16px 24px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
}
.ticket__footer-brand {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--text-sm); font-weight: 700; color: var(--neutral-900);
  text-decoration: none;
}
.ticket__footer-brand img { height: 24px; width: 24px; }
.ticket__footer-note {
  font-size: 12px; color: var(--neutral-600);
}

/* ── What's next panel ── */
.next-panel {
  max-width: 560px; margin: 24px auto 0;
  background: var(--neutral-0);
  border-radius: var(--radius-lg);
  border: 1px solid rgba(36,70,200,.09);
  box-shadow: var(--shadow-sm);
  padding: 22px 24px;
}
.next-panel__title {
  font-size: var(--text-md); font-weight: 700;
  color: var(--neutral-900); margin: 0 0 16px;
  display: flex; align-items: center; gap: 8px;
}
.next-steps { display: flex; flex-direction: column; gap: 12px; }
.next-step {
  display: flex; align-items: flex-start; gap: 12px;
  font-size: var(--text-sm); color: var(--neutral-600);
}
.next-step__num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--blue-100); color: var(--blue-700);
  font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.next-step__text { line-height: 1.5; padding-top: 2px; }
.next-step__text strong { color: var(--neutral-900); }

/* ── More events strip ── */
.more-events {
  max-width: 560px; margin: 24px auto 0;
}
.more-events__title {
  font-size: var(--text-md); font-weight: 700;
  color: var(--neutral-900); margin: 0 0 14px;
}

/* ── Loading / error ── */
.cf-loading {
  text-align: center; padding: 80px 20px;
  color: var(--neutral-600); font-size: var(--text-md);
  max-width: 560px; margin: 0 auto;
}
</style>

<!-- fetch intercept — same pattern as calendar/community/sponsors -->
<script>
(function() {
  var _fetch = window.fetch.bind(window);
  window.fetch = function(url, opts) {
    var p = _fetch(url, opts);
    if (typeof url === "string" && url.includes("events.json")) {
      p.then(function(r) { return r.clone().json(); })
       .then(function(data) {
         window.__cfEvents = data;
         if (typeof window.__cfReady === "function") window.__cfReady(data);
       })
       .catch(function() {});
    }
    return p;
  };
})();
</script>
</head>

<body>

<div id="navbar" data-loader="../components/navbar.html"></div>

<main id="main-content" class="py-5">
<div class="container">
  <div id="cf-root">
    <div class="cf-loading">Loading your registration&hellip;</div>
  </div>
</div>
</main>

<div id="footer" data-loader="../components/footer.html"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/_loader.js"></script>
<script src="/assets/js/events.js"></script>

<script>
/* =====================================================
   EVENT CONFIRM — driven by ?id= from events.json
   Reuses parseEventId(), esc(), avatarHtml(),
   tagClass(), renderEventCard() from events.js
   ===================================================== */
(function() {

  var pivotId = new URLSearchParams(location.search).get("id");

  /* ── generate a deterministic confirmation code from the event id ── */
  function confirmCode(id) {
    var code = "EXP-";
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var seed  = 0;
    for (var i = 0; i < id.length; i++) { seed = (seed * 31 + id.charCodeAt(i)) & 0xffffffff; }
    for (var j = 0; j < 8; j++) {
      seed = (seed * 1664525 + 1013904223) & 0xffffffff;
      code += chars[Math.abs(seed) % chars.length];
      if (j === 3) code += "-";
    }
    return code;
  }

  /* ── icon helpers using string concat (no template literals with HTML) ── */
  function iconSvg(type) {
    if (type === "calendar") {
      return '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
        + '<rect x="3" y="4" width="18" height="18" rx="2"/>'
        + '<line x1="16" y1="2" x2="16" y2="6"/>'
        + '<line x1="8" y1="2" x2="8" y2="6"/>'
        + '<line x1="3" y1="10" x2="21" y2="10"/>'
        + '</svg>';
    }
    if (type === "location") {
      return '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
        + '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/>'
        + '<circle cx="12" cy="10" r="3"/>'
        + '</svg>';
    }
    if (type === "people") {
      return '<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
        + '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>'
        + '<circle cx="9" cy="7" r="4"/>'
        + '<path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'
        + '</svg>';
    }
    if (type === "check") {
      return '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">'
        + '<polyline points="20 6 9 17 4 12"/>'
        + '</svg>';
    }
    if (type === "ticket") {
      return '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
        + '<path d="M22 10V6c0-1.11-.9-2-2-2H4c-1.1 0-1.99.89-1.99 2v4c1.1 0 1.99.9 1.99 2s-.89 2-1.99 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2z"/>'
        + '</svg>';
    }
    if (type === "info") {
      return '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
        + '<circle cx="12" cy="12" r="10"/>'
        + '<line x1="12" y1="8" x2="12" y2="12"/>'
        + '<line x1="12" y1="16" x2="12.01" y2="16"/>'
        + '</svg>';
    }
    return "";
  }

  /* ── main render ── */
  function render(allEvents) {
    var root = document.getElementById("cf-root");

    if (!pivotId) {
      root.innerHTML = '<div class="cf-loading">No event ID specified. Add <code>?id=eventMMDDYYHH</code> to the URL.</div>';
      return;
    }

    var ev = allEvents.find(function(e) { return e.id === pivotId; });
    if (!ev) {
      root.innerHTML = '<div class="cf-loading">Event not found.</div>';
      return;
    }

    var d = parseEventId(ev.id);  /* from events.js */
    if (!d) {
      root.innerHTML = '<div class="cf-loading">Could not parse event date.</div>';
      return;
    }

    /* page meta */
    document.title = "You're going! " + ev.title + " | Exponanta";

    var code = confirmCode(ev.id);

    /* tags */
    var tagsHtml = (ev.tags || []).map(function(t) {
      return '<span class="etag ' + tagClass(t) + '">' + esc(t) + '</span>';
    }).join("");

    /* avatars */
    var avatarsHtml = (ev.avatars || []).map(avatarHtml).join("");
    var moreCount   = Math.max(0, (ev.going || 0) - (ev.avatars ? ev.avatars.length : 0));
    var moreHtml    = moreCount > 0 ? '<span class="avatar avatar-more">+' + moreCount + '</span>' : "";

    /* calendar buttons */
    var calBtns = "";
    if (ev.calendar && ev.calendar.google) {
      calBtns += '<a class="btn-ev-cal" href="' + esc(ev.calendar.google) + '" target="_blank" rel="noopener">'
        + iconSvg("calendar") + ' Google Calendar</a>';
    }
    if (ev.calendar && ev.calendar.ical) {
      calBtns += '<a class="btn-ev-cal" href="' + esc(ev.calendar.ical) + '" target="_blank" rel="noopener">'
        + iconSvg("calendar") + ' iCal / Outlook</a>';
    }

    /* connect button */
    var connectBtn = ev.connectUrl
      ? '<a class="btn-ev-connect" href="' + esc(ev.connectUrl) + '" target="_blank" rel="noopener">Connect with Attendees</a>'
      : "";

    /* more events: upcoming, same primary tag, excluding pivot */
    var now = Date.now();
    var primaryTag = (ev.tags || []).find(function(t) {
      return ["Community","Concert","Workshop","Conference","Meetup","Music","Outdoor"].includes(t);
    }) || (ev.tags && ev.tags[0]) || "";

    var moreEvents = allEvents
      .filter(function(e) {
        return e.id !== ev.id
          && (parseEventId(e.id) ? parseEventId(e.id).ts : 0) > now
          && (e.tags || []).includes(primaryTag);
      })
      .sort(function(a, b) {
        return (parseEventId(a.id) ? parseEventId(a.id).ts : 0)
             - (parseEventId(b.id) ? parseEventId(b.id).ts : 0);
      })
      .slice(0, 2);

    var moreEventsHtml = "";
    if (moreEvents.length) {
      moreEventsHtml = '<div class="more-events">'
        + '<div class="more-events__title">More ' + esc(primaryTag) + ' events</div>'
        + moreEvents.map(function(e) { return renderEventCard(e); }).join("")
        + '</div>';
    }

    /* ── assemble ticket ── */
    root.innerHTML =

      /* ticket */
      '<div class="ticket">'

        /* hero image */
        + (ev.image
          ? '<img class="ticket__img" src="' + esc(ev.image) + '" alt="' + esc(ev.title) + '">'
          : '<div class="ticket__img-placeholder"></div>')

        /* confirmed badge */
        + '<div class="ticket__confirmed">'
          + '<div class="ticket__check">' + iconSvg("check") + '</div>'
          + '<div class="ticket__confirmed-text">Registration Confirmed</div>'
        + '</div>'

        /* body */
        + '<div class="ticket__body">'

          + '<h1 class="ticket__title">' + esc(ev.title) + '</h1>'

          + (tagsHtml ? '<div class="evh__tags mb-3">' + tagsHtml + '</div>' : '')

          /* detail rows */
          + '<div class="ticket__details">'

            + '<div class="ticket__detail">'
              + '<div class="ticket__detail-icon">' + iconSvg("calendar") + '</div>'
              + '<div>'
                + '<div class="ticket__detail-label">Date &amp; Time</div>'
                + '<div class="ticket__detail-value">' + d.weekday + ', ' + d.monthLabel + ' ' + d.day + ', ' + d.year + ' &middot; ' + d.timeLabel + '</div>'
              + '</div>'
            + '</div>'

            + '<div class="ticket__detail">'
              + '<div class="ticket__detail-icon">' + iconSvg("location") + '</div>'
              + '<div>'
                + '<div class="ticket__detail-label">Location</div>'
                + '<div class="ticket__detail-value">'
                  + '<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ev.location) + '" target="_blank" rel="noopener" style="color:var(--blue-700);text-decoration:none;font-weight:600;">'
                  + esc(ev.location) + '</a>'
                + '</div>'
              + '</div>'
            + '</div>'

            + '<div class="ticket__detail">'
              + '<div class="ticket__detail-icon">' + iconSvg("people") + '</div>'
              + '<div>'
                + '<div class="ticket__detail-label">Attendees</div>'
                + '<div class="ticket__detail-value">'
                  + '<div class="ticket__attendees" style="margin:0;">'
                    + avatarsHtml + moreHtml
                    + '<span>' + (ev.going || 0) + ' going</span>'
                  + '</div>'
                + '</div>'
              + '</div>'
            + '</div>'

            + (ev.presenter ? (
              '<div class="ticket__detail">'
                + '<div class="ticket__detail-icon">' + iconSvg("info") + '</div>'
                + '<div>'
                  + '<div class="ticket__detail-label">Presenter</div>'
                  + '<div class="ticket__detail-value">' + esc(ev.presenter) + '</div>'
                + '</div>'
              + '</div>'
            ) : '')

          + '</div>' /* /ticket__details */

          /* confirmation code */
          + '<div class="ticket__code">'
            + '<div>'
              + '<div class="ticket__code-label">Confirmation Code</div>'
              + '<div class="ticket__code-val" id="cf-code">' + esc(code) + '</div>'
            + '</div>'
            + '<button class="ticket__code-copy" id="cf-copy-btn">Copy</button>'
          + '</div>'

          /* actions */
          + '<div class="ticket__actions">'
            + calBtns
            + connectBtn
          + '</div>'

        + '</div>' /* /ticket__body */

        /* tear line */
        + '<div class="ticket__tear"><div class="ticket__tear-line"></div></div>'

        /* footer */
        + '<div class="ticket__footer">'
          + '<a class="ticket__footer-brand" href="/">'
            + '<img src="/brandbook/logo.svg" alt="Exponanta">'
            + 'Exponanta'
          + '</a>'
          + '<div class="ticket__footer-note">A confirmation has been sent to your email.</div>'
        + '</div>'

      + '</div>' /* /ticket */

      /* what's next */
      + '<div class="next-panel">'
        + '<div class="next-panel__title">' + iconSvg("ticket") + ' What happens next</div>'
        + '<div class="next-steps">'
          + '<div class="next-step">'
            + '<div class="next-step__num">1</div>'
            + '<div class="next-step__text"><strong>Add to your calendar</strong> — use the buttons above so you don\'t miss it.</div>'
          + '</div>'
          + '<div class="next-step">'
            + '<div class="next-step__num">2</div>'
            + '<div class="next-step__text"><strong>Connect with attendees</strong> — say hi before the event and make your first connection.</div>'
          + '</div>'
          + '<div class="next-step">'
            + '<div class="next-step__num">3</div>'
            + '<div class="next-step__text"><strong>Show up</strong> — bring your confirmation code <strong>' + esc(code) + '</strong> or just your name at the door.</div>'
          + '</div>'
        + '</div>'
      + '</div>'

      /* more events */
      + moreEventsHtml;

    /* copy button */
    var copyBtn = document.getElementById("cf-copy-btn");
    if (copyBtn) {
      copyBtn.addEventListener("click", function() {
        var codeEl = document.getElementById("cf-code");
        if (codeEl) {
          navigator.clipboard.writeText(codeEl.textContent).then(function() {
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add("copied");
            setTimeout(function() {
              copyBtn.textContent = "Copy";
              copyBtn.classList.remove("copied");
            }, 2000);
          }).catch(function() {
            copyBtn.textContent = "Copied!";
            setTimeout(function() { copyBtn.textContent = "Copy"; }, 2000);
          });
        }
      });
    }
  }

  /* ── boot ── */
  window.__cfReady = function(data) { render(data); };
  if (window.__cfEvents) { render(window.__cfEvents); }

  document.addEventListener("DOMContentLoaded", function() {
    fetch("/data/events.json")
      .then(function(r) { return r.json(); })
      .then(render)
      .catch(function() {
        document.getElementById("cf-root").innerHTML =
          '<div class="cf-loading">Could not load event data.</div>';
      });
  });

})();
</script>

</body>
</html>
